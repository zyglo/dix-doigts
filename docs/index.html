<title>Dix Doigts</title>
<meta name="description" content="Apprendre à taper au clavier avec les dix doigts, en français : leçons, exercices, tests de vitesse et jeu. Marche aussi sans internet.">
<meta name="theme-color" content="#f1f3f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1513" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
/* Mise en page : bandeau fixe + contenu centré (1120 px).
   Motif récurrent : la feuille réglée Seyès (cahier d'écolier) pour la zone de frappe.
   Clair = cahier à encre bleue. Sombre = ardoise à la craie.
   Couleur = doigt (huit teintes), le reste reste neutre. */
:root {
  --bg: #f1f3f9;
  --surface: #ffffff;
  --surface-2: #f6f7fc;
  --ink: #161b33;
  --ink-2: #475070;
  --ink-3: #727a98;
  --line: #dadeee;
  --accent: #2a3dcf;
  --accent-ink: #ffffff;
  --accent-soft: #e4e8fb;
  --ok: #17794a;
  --ok-soft: #dcf2e6;
  --bad: #c9283a;
  --bad-soft: #fde3e7;
  --warn: #9a5b00;
  --warn-soft: #fcefd4;
  --paper: #fcfdff;
  --rule: #dfe5f8;
  --rule-strong: #bcc7ee;
  --margin: #e47a8b;
  --f-lp: #d64a68;
  --f-lr: #dd8528;
  --f-lm: #bf9d1b;
  --f-li: #2f9d58;
  --f-ri: #1a93b9;
  --f-rm: #4263d8;
  --f-rr: #7f50cc;
  --f-rp: #b8479f;
  --f-th: #7f87a6;
  --on-c: #ffffff;
  --r-apprenti: #8a90a8;
  --r-bronze: #b4713a;
  --r-argent: #8a94a8;
  --r-or: #c99510;
  --r-platine: #2f9fb4;
  --r-diamant: #5675ee;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --radius: 12px;
  --shadow: 0 1px 0 rgba(20, 28, 70, .04), 0 6px 18px -10px rgba(20, 28, 70, .18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513;
    --surface: #16201d;
    --surface-2: #1c2926;
    --ink: #ecf1ec;
    --ink-2: #b7c5bd;
    --ink-3: #8a9b93;
    --line: #2b3a35;
    --accent: #a4bcff;
    --accent-ink: #0e1513;
    --accent-soft: #212d4d;
    --ok: #73d6a0;
    --ok-soft: #173126;
    --bad: #ff909b;
    --bad-soft: #3c2025;
    --warn: #f1c364;
    --warn-soft: #382e15;
    --paper: #18231f;
    --rule: #22302b;
    --rule-strong: #30443d;
    --margin: #a85a69;
    --f-lp: #ff7e97;
    --f-lr: #ffa34f;
    --f-lm: #e8cb4c;
    --f-li: #5fd185;
    --f-ri: #4dc4e9;
    --f-rm: #8199ff;
    --f-rr: #b78eff;
    --f-rp: #f07fdb;
    --f-th: #92a0ad;
    --on-c: #0c1311;
    --r-apprenti: #8a9b93;
    --r-bronze: #d58d54;
    --r-argent: #bcc5d6;
    --r-or: #f0c443;
    --r-platine: #5fcfe2;
    --r-diamant: #94a8ff;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -12px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513;
  --surface: #16201d;
  --surface-2: #1c2926;
  --ink: #ecf1ec;
  --ink-2: #b7c5bd;
  --ink-3: #8a9b93;
  --line: #2b3a35;
  --accent: #a4bcff;
  --accent-ink: #0e1513;
  --accent-soft: #212d4d;
  --ok: #73d6a0;
  --ok-soft: #173126;
  --bad: #ff909b;
  --bad-soft: #3c2025;
  --warn: #f1c364;
  --warn-soft: #382e15;
  --paper: #18231f;
  --rule: #22302b;
  --rule-strong: #30443d;
  --margin: #a85a69;
  --f-lp: #ff7e97;
  --f-lr: #ffa34f;
  --f-lm: #e8cb4c;
  --f-li: #5fd185;
  --f-ri: #4dc4e9;
  --f-rm: #8199ff;
  --f-rr: #b78eff;
  --f-rp: #f07fdb;
  --f-th: #92a0ad;
  --on-c: #0c1311;
  --r-apprenti: #8a9b93;
  --r-bronze: #d58d54;
  --r-argent: #bcc5d6;
  --r-or: #f0c443;
  --r-platine: #5fcfe2;
  --r-diamant: #94a8ff;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
}
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(1.9rem, 1.1rem + 2.6vw, 3.1rem); font-weight: 700; letter-spacing: -.025em; }
h2 { font-size: clamp(1.3rem, 1.05rem + 1vw, 1.75rem); font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.muted { color: var(--ink-3); }
.small { font-size: .875rem; }
.lead { font-size: 1.15rem; color: var(--ink-2); max-width: 62ch; }
.prose { max-width: 66ch; color: var(--ink-2); }
.kicker { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 600; color: var(--accent); }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Structure ---------- */
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding-inline: 20px; }
.page { padding-block: 28px 64px; display: flex; flex-direction: column; gap: 40px; }
.band { display: flex; flex-direction: column; gap: 18px; }
.page-head { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 28px; align-items: center; }
@media (max-width: 820px) { .split { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; box-shadow: var(--shadow); }
.panel h2 { font-size: 1.15rem; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.tile p { color: var(--ink-2); font-size: .95rem; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.cta-row { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 8px 18px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 600; text-decoration: none; line-height: 1.2;
  transition: transform .08s, background .12s, border-color .12s;
}
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.lg { min-height: 50px; padding: 10px 24px; font-size: 1.05rem; }
.btn.sm { min-height: 34px; padding: 4px 12px; font-size: .9rem; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: .8rem; font-weight: 600; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: .9rem; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
kbd {
  font-family: var(--font-mono); font-size: .85em; font-weight: 500;
  display: inline-block; min-width: 1.7em; padding: .1em .45em; text-align: center;
  background: var(--surface); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; color: var(--ink);
}
.kc { --c: var(--ink-3); display: inline-flex; }
.kc kbd { border-color: color-mix(in srgb, var(--c) 70%, var(--line)); border-bottom-color: var(--c); background: color-mix(in srgb, var(--c) 28%, var(--surface)); font-weight: 600; }


/* ---------- En-tête ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1120px; margin: 0 auto; padding: 8px 20px; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 0; flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; letter-spacing: -.02em; }
.logo { display: inline-flex; align-items: flex-end; gap: 2px; height: 22px; }
.logo i { width: 4px; border-radius: 2px; background: var(--c); }
.logo i:nth-child(1), .logo i:nth-child(8) { height: 11px; } .logo i:nth-child(2), .logo i:nth-child(7) { height: 16px; }
.logo i:nth-child(3), .logo i:nth-child(6) { height: 22px; } .logo i:nth-child(4), .logo i:nth-child(5) { height: 17px; }
.nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav-i { background: none; border: 0; padding: 8px 12px; border-radius: 8px; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.nav-i:hover { background: var(--surface-2); color: var(--ink); }
.nav-i.on { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.top-actions { display: flex; gap: 2px; flex: none; }
.icon-btn { display: grid; place-items: center; width: 40px; height: 40px; background: none; border: 0; border-radius: 10px; color: var(--ink-2); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.on { color: var(--accent); }
@media (max-width: 760px) {
  .top-in { flex-wrap: wrap; row-gap: 0; }
  .nav { order: 3; flex-basis: 100%; }
  .brand-name { font-size: 1.05rem; }
}
.foot { border-top: 1px solid var(--line); background: var(--surface); }
.foot-in { max-width: 1120px; margin: 0 auto; padding: 18px 20px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; font-size: .9rem; color: var(--ink-2); }
main { outline: none; min-height: 60vh; }

/* ---------- Accueil ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 36px; align-items: center; padding-top: 12px; }
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; } }
.hero-copy { display: flex; flex-direction: column; gap: 18px; }
.hero-demo { display: flex; flex-direction: column; gap: 12px; align-items: stretch; min-width: 0; }
.cta .lg { flex: 0 1 auto; }
.stat { display: flex; gap: 16px; align-items: center; }
.big-n { font-family: var(--font-display); font-weight: 700; font-size: 2.6rem; line-height: 1; letter-spacing: -.03em; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.big-n small { font-family: var(--font-body); font-size: .75rem; font-weight: 500; color: var(--ink-3); letter-spacing: 0; margin-top: 4px; }
.ring { position: relative; width: var(--s, 76px); height: var(--s, 76px); flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 7; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s; }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: .95rem; font-variant-numeric: tabular-nums; }
.mods { align-items: stretch; }
.mod-card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mod-card:hover { border-color: var(--accent); }
.mc-title { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }
.mc-blurb { color: var(--ink-2); font-size: .92rem; flex: 1; }
.mc-foot { display: flex; justify-content: space-between; font-size: .85rem; color: var(--ink-3); }
.mc-done { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.mc-bar { display: block; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.mc-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; counter-reset: s; }
.steps li { counter-increment: s; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 18px 18px 64px; position: relative; display: flex; flex-direction: column; gap: 4px; }
.steps li::before { content: counter(s); position: absolute; left: 18px; top: 16px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-family: var(--font-display); }
.steps li span { color: var(--ink-2); font-size: .95rem; }
.callout-band { background: var(--accent-soft); border-radius: 16px; padding: 24px; }
.callout-band p { color: var(--ink-2); }

/* ---------- Clavier virtuel ---------- */
.kb { container-type: inline-size; width: 100%; display: flex; flex-direction: column; gap: calc(100cqw / 15 * .07); }
.kb-row { display: flex; gap: calc(100cqw / 15 * .07); }
.kb-row > i { flex: var(--w, 1) 1 0; }
.key {
  --c: var(--ink-3);
  flex: var(--w, 1) 1 0; min-width: 0;
  height: calc(100cqw / 15 * .86);
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: calc(100cqw / 15 * .13);
  font-family: var(--font-mono); font-size: calc(100cqw / 15 * .3); font-weight: 500; line-height: 1;
  color: var(--ink);
  background: color-mix(in srgb, var(--c) 27%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--c) 72%, var(--line));
  border-bottom-width: calc(100cqw / 15 * .045);
  user-select: none;
  transition: background .08s, transform .08s, opacity .15s, box-shadow .08s;
}
.key .lt { font-weight: 600; }
.key .s { position: absolute; top: 12%; left: 0; right: 0; text-align: center; font-size: .72em; color: var(--ink-3); }
.key .b { position: relative; }
.key:not(.lt):not(.mod):has(.s) .b { margin-top: 26%; }
.key.mod { --c: var(--ink-3); background: var(--surface-2); color: var(--ink-3); font-family: var(--font-body); font-size: calc(100cqw / 15 * .2); }
.key.space .b { font-family: var(--font-body); font-size: .75em; color: var(--ink-3); }
.key.bump::after { content: ''; position: absolute; bottom: 14%; left: 30%; right: 30%; height: calc(100cqw / 15 * .035); border-radius: 2px; background: color-mix(in srgb, var(--ink) 55%, transparent); }
.kb.has-focus .key:not(.is-new):not(.is-target):not(.is-shift) { opacity: .42; }
.key.is-new { background: color-mix(in srgb, var(--c) 68%, var(--surface)); border-color: var(--c); color: var(--on-c); font-weight: 700; }
.key.is-new.f-lm, .key.is-new.f-li { color: #101820; }
.key.is-target { background: var(--c); border-color: var(--c); color: var(--on-c); transform: translateY(1px); box-shadow: 0 0 0 calc(100cqw / 15 * .05) color-mix(in srgb, var(--c) 35%, transparent); opacity: 1; }
.key.is-target .s { color: var(--on-c); }
.key.is-target.f-lm, .key.is-target.f-li { color: #101820; }
.key.mod.is-shift { background: var(--ink); color: var(--surface); border-color: var(--ink); opacity: 1; }
.key.is-hit { background: var(--ok-soft); border-color: var(--ok); }
.key.is-miss { background: var(--bad); border-color: var(--bad); color: var(--on-c); }
.kb.heatmap .key { background: var(--surface-2); border-color: var(--line); }
.kb.heatmap .key.has-heat { background: color-mix(in srgb, var(--bad) calc(var(--heat) * 80%), var(--surface-2)); }
.kb-wrap { width: 100%; max-width: 900px; min-width: 0; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; color: var(--ink-2); }
.legend li { display: flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 4px; background: var(--c); display: inline-block; }
.sw-inline { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 8px; }

/* ---------- Mains ---------- */
.hands { display: flex; justify-content: center; gap: clamp(1.5rem, 8vw, 4rem); padding: 8px 0 2px; }
.hand { display: flex; align-items: flex-end; gap: 5px; }
.fg { --c: var(--f-th); width: clamp(14px, 3vw, 22px); border-radius: 11px 11px 6px 6px; background: color-mix(in srgb, var(--c) 30%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 70%, var(--line)); transition: transform .08s, background .08s; }
.hand.hl .fg:nth-child(1), .hand.hr .fg:nth-child(5) { height: 34px; }
.hand.hl .fg:nth-child(2), .hand.hr .fg:nth-child(4) { height: 46px; }
.hand.hl .fg:nth-child(3), .hand.hr .fg:nth-child(3) { height: 54px; }
.hand.hl .fg:nth-child(4), .hand.hr .fg:nth-child(2) { height: 46px; }
.hand.hl .fg:nth-child(5), .hand.hr .fg:nth-child(1) { height: 28px; }
.hand.hl .fg.th { transform: rotate(-18deg); } .hand.hr .fg.th { transform: rotate(18deg); }
.fg.on { background: var(--c); border-color: var(--c); transform: translateY(-8px); }
.hand.hl .fg.th.on { transform: rotate(-18deg) translateY(-8px); } .hand.hr .fg.th.on { transform: rotate(18deg) translateY(-8px); }

/* ---------- Feuille Seyès : zone de frappe ---------- */
.sheet {
  --fs: 1.5rem; --lh: calc(var(--fs) * 2.15);
  position: relative; border: 1px solid var(--line); border-radius: var(--radius); background-color: var(--paper);
  background-image:
    linear-gradient(to bottom, transparent calc(100% - 1.5px), var(--rule-strong) 0),
    linear-gradient(to bottom, transparent calc(100% - 1px), var(--rule) 0),
    linear-gradient(to right, transparent calc(100% - 1px), var(--rule) 0);
  background-size: 100% var(--lh), 100% calc(var(--lh) / 4), calc(var(--lh) * 1.6) 100%;
  background-position: 0 calc(var(--fs) * -0.5), 0 calc(var(--fs) * -0.5), 0 0;
  padding: 0 20px 0 clamp(36px, 7vw, 64px);
  box-shadow: var(--shadow);
}
.sheet::before { content: ''; position: absolute; top: 0; bottom: 0; left: clamp(26px, 5.4vw, 48px); width: 2px; background: var(--margin); opacity: .8; }
.sheet .viewport { height: calc(var(--lh) * 3); overflow: hidden; }
.sheet .inner { font-family: var(--font-mono); font-size: var(--fs); line-height: var(--lh); font-weight: 400; transition: transform .14s ease-out; letter-spacing: .01em; }
.sheet .w { display: inline-block; white-space: nowrap; }
.sheet .c { position: relative; white-space: pre; color: var(--ink); }
.sheet .c.ok { color: var(--ok); }
.sheet .c.fixed { color: var(--warn); }
.sheet .c.wrong { color: var(--bad); background: var(--bad-soft); border-radius: 3px; }
.sheet .c.cur { background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); border-radius: 3px; }
.sheet .c.cur.bad { background: var(--bad-soft); box-shadow: inset 0 -3px 0 var(--bad); }
.sheet .c.sp::after { content: '·'; position: absolute; left: 0; right: 0; text-align: center; color: var(--ink-3); opacity: .7; }
.sheet.no-spaces .c.sp::after { content: none; }
.sheet.blind .c:not(.cur) { color: transparent; }
.sheet.shake { animation: shake .18s; }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.sheet-hint { position: absolute; left: clamp(36px, 7vw, 64px); right: 16px; bottom: 6px; font-size: .85rem; color: var(--ink-3); background: var(--paper); padding: 2px 8px; border-radius: 6px; transition: opacity .2s; }
.sheet-hint.hide { opacity: 0; pointer-events: none; }
.sheet-hint.warn { color: var(--warn); opacity: 1; }
.sheet.mini { --fs: clamp(1.2rem, 4vw, 1.6rem); }
.sheet.mini .viewport { height: auto; padding-block: calc(var(--lh) * .1); }
.sheet.mini .inner { transition: none; }

/* ---------- Session de frappe ---------- */
.session { display: flex; flex-direction: column; gap: 16px; }
.s-top { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-start; }
.s-title { display: flex; flex-direction: column; gap: 4px; }
.s-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.hud { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
@media (max-width: 520px) { .hud { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.hud-i { display: flex; flex-direction: column; }
.hud-i .v { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hud-i .l { font-size: .78rem; color: var(--ink-3); }
.prog { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.prog.pulse { animation: pulse .12s; }
@keyframes pulse { 50% { transform: scaleY(2); } }
.guide { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 16px; }
.next { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; min-height: 1.6em; }
.next .l { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); font-weight: 600; }
.next .t { font-weight: 600; }
.guide .kb { max-width: 760px; margin-inline: auto; }

/* ---------- Résultats ---------- */
.result { display: flex; flex-direction: column; gap: 20px; }
.result-head { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.verdict { padding: 8px 14px; border-radius: 10px; font-weight: 500; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.ko { background: var(--warn-soft); color: var(--warn); }
.big-stats .panel { display: flex; flex-direction: column; gap: 2px; }
.bs-v { font-family: var(--font-display); font-weight: 700; font-size: 2.3rem; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.bs-v small { font-size: 1rem; font-weight: 600; margin-left: 2px; }
.bs-l { color: var(--ink-3); font-size: .85rem; }
.miss-list { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 10px; }
.miss { display: inline-flex; align-items: center; gap: 8px; }
.miss b { font-variant-numeric: tabular-nums; color: var(--bad); }
.level-box b { font-family: var(--font-display); font-size: 1.4rem; }
.stars { display: inline-flex; gap: 3px; vertical-align: middle; }
.stars svg { width: 18px; height: 18px; fill: none; stroke: var(--ink-3); stroke-width: 1.4; stroke-linejoin: round; opacity: .6; }
.stars svg.on { fill: var(--f-lm); stroke: var(--f-lm); opacity: 1; }

/* ---------- Parcours ---------- */
.module { display: flex; flex-direction: column; gap: 10px; }
.module-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.lesson-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 10px; }
.lesson-card { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.lesson-card:hover { border-color: var(--accent); }
.lesson-card.next { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.lesson-card.done { background: color-mix(in srgb, var(--ok-soft) 55%, var(--surface)); }
.lc-n { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); font-weight: 700; font-variant-numeric: tabular-nums; font-family: var(--font-display); }
.lesson-card.done .lc-n { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.lesson-card.next .lc-n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.lc-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.lc-title { font-weight: 600; line-height: 1.3; }
.lc-short { font-size: .88rem; color: var(--ink-3); }
.lc-keys { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.lc-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

/* ---------- Leçon ---------- */
.crumbs { display: flex; gap: 8px; align-items: center; color: var(--ink-3); font-size: .9rem; }
.lesson-head { display: flex; flex-direction: column; gap: 12px; }
.lh-keys { display: flex; flex-wrap: wrap; gap: 6px; }
.lh-keys .kc kbd { font-size: 1.1rem; padding: .25em .6em; }
.lesson-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 920px) { .lesson-grid { grid-template-columns: 1fr; } }
.lesson-text { display: flex; flex-direction: column; gap: 14px; }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; }
.block h2 { font-size: 1.05rem; }
.block p { color: var(--ink-2); max-width: 64ch; }
.block.warn { border-left: 4px solid var(--warn); }
.block.tip { border-left: 4px solid var(--ok); }
.finger-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.finger-list li { display: flex; gap: 12px; align-items: center; }
.word-chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.word-chips li { font-family: var(--font-mono); padding: 3px 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; }
.lesson-side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); min-width: 0; }
@media (max-width: 920px) { .lesson-side { position: static; } }
.stages { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.stage { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.stage.done { border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
.sg-n { width: 28px; height: 28px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
.stage.done .sg-n { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.sg-main { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
.sg-main .muted { font-size: .85rem; }
.sg-meta { grid-column: 2; display: flex; gap: 8px; align-items: center; }
.stage .btn { grid-column: 3; grid-row: 1 / span 2; }
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* ---------- Guide ---------- */
.toc { display: flex; flex-wrap: wrap; gap: 8px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.tbl { border-collapse: collapse; width: 100%; font-size: .95rem; }
.tbl th, .tbl td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl thead th { background: var(--surface-2); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.tbl tbody th { font-weight: 600; white-space: nowrap; }
.tbl tr:last-child td, .tbl tr:last-child th { border-bottom: 0; }
.tbl.dense th, .tbl.dense td { padding: 7px 10px; }
.note { padding: 12px 16px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); }
.note.tip { background: var(--ok-soft); }
.note.warn { background: var(--warn-soft); }
.key-info { min-height: 3.2rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.chain { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 8px; min-height: 64px; }
.ch { --c: var(--ink-3); display: flex; flex-direction: column; align-items: center; min-width: 44px; padding: 6px 8px; border-radius: 10px; background: color-mix(in srgb, var(--c) 28%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 70%, var(--line)); border-bottom: 3px solid var(--c); line-height: 1.2; }
.ch b { font-family: var(--font-mono); font-size: 1.3rem; }
.ch i { font-style: normal; font-size: .68rem; color: var(--ink-2); }
.ch u { text-decoration: none; font-size: .68rem; font-weight: 700; color: var(--ink); }
.ch.sp { opacity: .6; }
.ticks { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 8px; }
.ticks li { padding-left: 26px; position: relative; color: var(--ink-2); }
.ticks li::before { content: ''; position: absolute; left: 4px; top: .55em; width: 10px; height: 6px; border-left: 2px solid var(--ok); border-bottom: 2px solid var(--ok); transform: rotate(-45deg); }
.plan { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.plan-row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.pl-w { display: flex; flex-direction: column; line-height: 1.3; }
.pl-w span { color: var(--ink-3); font-size: .85rem; }
.pl-d p { margin-top: 6px; color: var(--ink-2); font-size: .93rem; }
@media (max-width: 480px) { .plan-row { grid-template-columns: 1fr; } }
.faq { display: flex; flex-direction: column; gap: 8px; }
.faq details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.faq summary { cursor: pointer; font-weight: 600; }
.faq details[open] summary { margin-bottom: 8px; }
.faq p { color: var(--ink-2); max-width: 66ch; }

/* ---------- Formulaires ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-weight: 600; font-size: .92rem; }
input[type="text"], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 42px;
}
textarea { font-family: var(--font-mono); font-size: .85rem; resize: vertical; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 8px; }
.opts.compact { grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
.opt { position: relative; display: block; cursor: pointer; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt > span { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); height: 100%; }
.opt small { color: var(--ink-3); font-size: .82rem; line-height: 1.35; }
.opt input:checked + span { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.opt input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-radio { position: relative; cursor: pointer; }
.chip-radio input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip-radio span { display: inline-block; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 500; }
.chip-radio input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip-radio input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.check input { margin-top: .35em; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.check span { display: flex; flex-direction: column; }
.check small { color: var(--ink-3); }
.practice-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .practice-grid { grid-template-columns: 1fr; } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
.seg button { background: var(--surface-2); border: 0; padding: 8px 16px; font-weight: 500; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.levels { list-style: none; margin: 10px 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.levels li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; }
.levels span { color: var(--ink-2); }

/* ---------- Statistiques ---------- */
.stat-tiles .panel { display: flex; flex-direction: column; gap: 2px; }
.chart { width: 100%; height: auto; display: block; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--ink-3); font-size: 11px; font-family: var(--font-body); }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.chart .ar { fill: var(--accent); opacity: .1; }
.chart .dt { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .dt.end { fill: var(--accent); }
.chart .end-l { fill: var(--ink); font-weight: 700; font-size: 12px; }
.weak-list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.weak { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.days { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 6px; align-items: end; height: 150px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; font-size: .75rem; color: var(--ink-3); }
.day .bar { flex: 1; width: 100%; display: flex; align-items: flex-end; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.day .bar i { display: block; width: 100%; background: var(--accent); border-radius: 6px 6px 0 0; min-height: 0; }
.day b { height: 1em; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- Jeu ---------- */
.game { display: flex; flex-direction: column; gap: 12px; }
.game-hud { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; }
.game-hud .btn { margin-left: auto; }
.arena { position: relative; height: clamp(300px, 52vh, 460px); overflow: hidden; border-radius: var(--radius); border: 1px solid var(--line); background-color: var(--paper);
  background-image: linear-gradient(to bottom, transparent calc(100% - 1px), var(--rule) 0), linear-gradient(to right, transparent calc(100% - 1px), var(--rule) 0);
  background-size: 100% 36px, 36px 100%; }
.arena .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; background: linear-gradient(to top, color-mix(in srgb, var(--bad) 22%, transparent), transparent); border-top: 2px dashed color-mix(in srgb, var(--bad) 55%, transparent); }
.arena.shake { animation: shake .18s; }
.fw { position: absolute; left: 0; top: 0; padding: 4px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 1.15rem; font-weight: 500; white-space: nowrap; box-shadow: var(--shadow); will-change: transform; }
.fw i { font-style: normal; color: var(--ok); }
.fw.target { border-color: var(--accent); background: var(--accent-soft); }
.fw.hit { opacity: 0; transition: opacity .25s; }
.fw.lost { opacity: 0; background: var(--bad-soft); transition: opacity .25s; }
.typed { font-family: var(--font-mono); font-size: 1.25rem; min-height: 2em; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.game-setup { display: flex; flex-direction: column; gap: 16px; max-width: 520px; }

/* ---------- Doigts : une couleur par doigt (en fin de feuille pour primer sur les valeurs par défaut) ---------- */
.f-lp { --c: var(--f-lp); } .f-lr { --c: var(--f-lr); } .f-lm { --c: var(--f-lm); } .f-li { --c: var(--f-li); }
.f-ri { --c: var(--f-ri); } .f-rm { --c: var(--f-rm); } .f-rr { --c: var(--f-rr); } .f-rp { --c: var(--f-rp); } .f-th { --c: var(--f-th); }
.fg.th { --c: var(--f-th); }

/* ---------- Préférences de mouvement ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Indicateur de sauvegarde ---------- */
.sync::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); margin-right: 6px; vertical-align: 1px; }
.sync.ok::before { background: var(--ok); }
.sync.saving::before, .sync.connecting::before { background: var(--accent); }
.sync.error::before { background: var(--warn); }

/* ---------- Rangs, médailles et jauges ---------- */
.medal { --rc: var(--r-apprenti); display: inline-block; width: 60px; height: 60px; flex: none; }
.medal svg { width: 100%; height: 100%; display: block; }
.medal .ring { fill: color-mix(in srgb, var(--rc) 30%, var(--surface)); stroke: var(--rc); stroke-width: 3; }
.medal .in { fill: var(--rc); }
.medal .star { fill: var(--surface); }
.medal.sm { width: 22px; height: 22px; vertical-align: -6px; }
.rank-line { display: inline-flex; align-items: center; gap: 6px; }
.r-apprenti { --rc: var(--r-apprenti); } .r-bronze { --rc: var(--r-bronze); } .r-argent { --rc: var(--r-argent); }
.r-or { --rc: var(--r-or); } .r-platine { --rc: var(--r-platine); } .r-diamant { --rc: var(--r-diamant); }
.level-panel { display: flex; flex-direction: column; gap: 22px; }
.lv-head { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; }
.lv-head.sm { gap: 12px; margin-bottom: 8px; }
.lv-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lv-id h3 { font-size: 1.9rem; letter-spacing: -.02em; }
.lv-next { margin-left: auto; max-width: 360px; display: flex; flex-direction: column; gap: 4px; }
.lv-gauges { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 24px 36px; }
.lv-gauges h4 { font-family: var(--font-display); font-size: 1rem; }
.gauge { padding: 0 14px; }
.g-rail { position: relative; margin: 38px 0 30px; }
.g-track { display: flex; gap: 2px; height: 14px; border-radius: 7px; overflow: hidden; }
.g-track i { flex: var(--w) 1 0; background: var(--rc); }
.g-track .a-low { background: var(--bad); } .g-track .a-mid { background: var(--warn); }
.g-track .a-good { background: var(--accent); } .g-track .a-top { background: var(--ok); }
.g-pin { position: absolute; bottom: calc(100% + 6px); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; white-space: nowrap; font-size: .85rem; line-height: 1; }
.g-pin b { background: var(--ink); color: var(--surface); padding: 4px 8px; border-radius: 6px; }
.g-pin::after { content: ''; border: 6px solid transparent; border-top-color: var(--ink); margin-top: -1px; }
.g-tick { position: absolute; top: -5px; width: 2px; height: 24px; transform: translateX(-1px); background: var(--ink); border-radius: 1px; }
.g-tick.base { background: var(--accent); }
.g-tick.avg { background: repeating-linear-gradient(to bottom, var(--ink) 0 4px, transparent 4px 7px); }
.g-lab { position: absolute; top: 22px; transform: translateX(-50%); font-size: .75rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.g-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .85rem; color: var(--ink-2); }
.g-legend li { display: flex; align-items: center; gap: 6px; }
.mk { display: inline-block; width: 3px; height: 14px; background: var(--ink); border-radius: 1px; }
.mk.base { background: var(--accent); }
.mk.avg { background: repeating-linear-gradient(to bottom, var(--ink) 0 3px, transparent 3px 5px); }
.sw.a-low { background: var(--bad); } .sw.a-mid { background: var(--warn); } .sw.a-good { background: var(--accent); } .sw.a-top { background: var(--ok); }
.rank-tbl tbody th { white-space: nowrap; }
.rank-tbl tr.cur { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }

.kb-check { display: flex; flex-direction: column; gap: 10px; border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 55%, var(--surface)); }

.kb-detect p { margin: 0; }
/* Application installable : écrans tactiles, encoches, installation */
#app { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
button, .key, .chip-radio, .opt, a { touch-action: manipulation; }
.soft-input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; resize: none; opacity: 0; color: transparent; background: transparent; caret-color: transparent; font-size: 16px; pointer-events: none; z-index: 2; }
@media (hover: none) and (pointer: coarse) { .soft-input { pointer-events: auto; } }
.install-card { display: flex; flex-direction: column; gap: 10px; }
.install-card h2, .install-card p { margin: 0; }

    const K = c.newKeys.length ? c.newKeys : c.plain;

    return build(n, () => {
      const a = pick(K), b = Math.random() < .6 ? pick(K) : pick(O);

  pseudo(c, n) { return build(n, () => pseudoWord(c, c.newPlain, 3, 5)); },

  words(c, n, o = {}) {

  wordsNew(c, n) {

  mixAll(c, n) {

    const newPool = c.newPlain.length ? wordPool(c, { must: c.newPlain }) : [];
    let last = '';

      let t;

  sentences(c, n, o = {}) {

  sentencesWithNew(c, n) {

  },
  text(c, n) {

  text2(c, n) {

  capsLetters(c, n) {

  names(c, n) {

  cities(c, n) {

  mixCaps(c, n) {

  punctWords(c, n, o = {}) {

  apos(c, n) {

  accentPat(c, n, o = {}) {

    const base = c.plain.filter(x => 'edrstlmnaiopu'.includes(x));
    if (!keys.length) return GEN.words(c, n);
    return build(n, () => {
      const a = pick(keys); const b = pick(base.length ? base : c.plain);

  puncts(c, n, o = {}) {

  digPat(c, n, o = {}) {

    return build(n, () => {
      const r = Math.random();

      const p = pick(pool); const r = Math.random();

  trigrams(c, n) {

  },
  bigramWords(c, n) {

  shortWords(c, n, o = {}) {

  longWords(c, n, o = {}) {

  sameFingerWords(c, n, o = {}) {

/* ---------- Étapes d'une leçon ---------- */
function stagesOf(lesson, id) {

  const hasVowel = c.plain.some(ch => VOWELS.includes(ch));
  if (lesson.stages) raw = lesson.stages.map(s => Object.assign({}, s));
  else if (!hasVowel && lesson.type === 'review') {
    raw = [
      { name: 'Mélange de touches', d: 'Les touches de la rangée, en vrac', gen: 'pseudo', n: 60 },
      { name: 'Rythme', d: 'Des motifs qui alternent les mains', gen: 'rhythm', n: 60 },
      { name: 'Séries courtes', d: 'Trois à cinq touches', gen: 'pseudo', n: 80 },
      { name: 'Séries longues', d: 'Cinq à sept touches', gen: 'pseudoLong', n: 100 },
      { name: 'Défi', d: 'Précision avant la vitesse', gen: 'pseudoLong', n: 130, goalAcc: 94 },
    ];
  } else if (!hasVowel) {
    raw = [
      { name: 'Repérage', d: 'Les nouvelles touches, seules', gen: 'pat', n: 36 },
      { name: 'Alternance', d: 'Nouvelles touches et anciennes', gen: 'alt', n: 48 },
      { name: 'Rythme', d: 'Des motifs qui alternent les mains', gen: 'rhythm', n: 54 },
      { name: 'Séries courtes', d: 'Trois à cinq touches', gen: 'pseudo', n: 70 },
      { name: 'Séries longues', d: 'Cinq à sept touches', gen: 'pseudoLong', n: 90 },
      { name: 'Défi', d: 'Tout ce que tu sais, mélangé', gen: 'pseudoLong', n: 120, goalAcc: 94 },
    ];
  } else if (lesson.type === 'review') {
    raw = [
      { name: 'Mélange de touches', d: 'Les touches de la leçon, en vrac', gen: 'pseudo', n: 60 },
      { name: 'Mots', d: 'De vrais mots', gen: 'wordsNew', n: 70 },
      { name: 'Mots variés', d: 'Toutes les touches apprises', gen: 'mixAll', n: 90 },
      { name: 'Phrases', d: 'Dans une phrase complète', gen: 'sentencesWithNew', n: 110 },
      { name: 'Défi', d: 'Précision avant la vitesse', gen: 'mixAll', n: 130, goalAcc: 94 },
    ];
  } else {
    raw = [
      { name: 'Repérage', d: 'Les nouvelles touches, seules', gen: 'pat', n: 36 },
      { name: 'Alternance', d: 'Nouvelles touches et anciennes', gen: 'alt', n: 48 },
      { name: 'Syllabes', d: 'Combinaisons pour automatiser le geste', gen: 'pseudo', n: 54 },
      { name: 'Mots', d: 'De vrais mots avec les nouvelles touches', gen: 'wordsNew', n: 70 },
      { name: 'Phrases', d: 'Dans une phrase complète', gen: 'sentencesWithNew', n: 100 },
      { name: 'Défi', d: 'Tout ce que tu sais, mélangé', gen: 'mixAll', n: 120, goalAcc: 94 },
    ];
  }
  // si le vocabulaire disponible est trop pauvre, on bascule sur des séries de lettres
  raw.forEach(s => {
    s.goalAcc = s.goalAcc || defGoal;
    if (s.gen === 'wordsNew' || s.gen === 'mixAll') {
      const p = wordPool(c, s.gen === 'wordsNew' ? { must: c.newPlain } : {});
      if (p.length < 6) { s.gen = 'pseudoLong'; if (s.name === 'Mots' || s.name === 'Mots variés') { s.name = 'Séries'; s.d = 'Des séries de lettres plus longues'; } }
    }
    if (s.gen === 'sentencesWithNew' || s.gen === 'sentences') {
      const p = s.gen === 'sentencesWithNew' ? sentencePool(c, null, c.newKeys) : [];
      if (p.length < 5) {
        const q = sentencePool(c);
        if (q.length >= 5) s.gen = 'sentences';
        else { s.gen = 'mixAll'; if (s.name === 'Phrases') { s.name = 'Mots enchaînés'; s.d = 'Des mots à la suite, sans pause'; } }
      }
    }
  });
  return raw.map((s, i) => Object.assign(s, { i }));
}
function genStage(stage, lesson, id) {
  const c = ctxForLesson(lesson, id);
  const f = GEN[stage.gen] || GEN.words;
  const t = f(c, stage.n, stage.opts || {});
  return normalizeText(t);
}
function normalizeText(t) {
  return String(t).normalize('NFC').replace(/\s+/g, ' ').trim();
}

/* ---------- Progression ---------- */
const stageRec = (lessonId, i) => ((Store.d.lessons[lessonId] || {}).stages || {})[i] || null;
function lessonState(lesson, id) {
  const st = stagesOf(lesson, id);
  let done = 0, stars = 0;
  st.forEach(s => { const r = stageRec(lesson.id, s.i); if (r && r.stars > 0) { done++; stars += r.stars; } });
  return { total: st.length, done, stars, max: st.length * 3, complete: done === st.length };
}
function starsFor(acc, goal) {
  if (acc >= Math.max(98, goal + 5)) return 3;
  if (acc >= goal + 3) return 2;
  if (acc >= goal) return 1;
  return 0;
}
function nextLesson(id) {
  const ls = lessonsFor(id);
  return ls.find(l => !lessonState(l, id).complete) || null;
}
function courseProgress(id) {
  const ls = lessonsFor(id);
  let done = 0; ls.forEach(l => { if (lessonState(l, id).complete) done++; });
  return { done, total: ls.length };
}

function addKeyStat(id, ch, ok, dt) {
  const info = LAYOUTS[id].map.get(ch);
  const b = info ? info.base : ch;
  const fam = LAYOUT_DEFS[id].family;
  const m = Store.d.keys[fam] || (Store.d.keys[fam] = {});
  const r = m[b] || (m[b] = { h: 0, m: 0, t: 0, n: 0 });
  if (ok) { r.h++; if (dt > 0 && dt < 1500) { r.t += dt; r.n++; } } else r.m++;
}
function logSession(entry) {
  const d = Store.d;
  d.history.push(entry);
  if (d.history.length > 600) d.history.splice(0, d.history.length - 600);
  const day = todayStr();
  d.days[day] = (d.days[day] || 0) + Math.round(entry.secs);
  if (entry.mode === 'test') {
    if (!d.baseline) d.baseline = { t: entry.t, wpm: entry.wpm, acc: entry.acc };
    if (entry.wpm > d.best.test && entry.acc >= 90) d.best.test = entry.wpm;
  }
  Store.save();
}
function streakDays() {
  const days = Store.d.days; let n = 0;
  const d = new Date();
  const key = x => x.getFullYear() + '-' + pad2(x.getMonth() + 1) + '-' + pad2(x.getDate());
  if (!days[key(d)]) d.setDate(d.getDate() - 1);
  while (days[key(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function weakKeys(id, count = 6, minSeen = 6) {
  const m = statsOf(id);
  const rows = Object.entries(m).map(([k, r]) => {
    const seen = r.h + r.m;
    return { k, seen, err: seen ? r.m / seen : 0, ms: r.n ? r.t / r.n : 0, m: r.m };
  }).filter(r => r.seen >= minSeen && /[a-zàâçéèêîôùû]/.test(r.k));
  rows.sort((a, b) => (b.err - a.err) || (b.ms - a.ms));
  return rows.slice(0, count);
}

/* ---------- Son (WebAudio, démarre après un geste) ---------- */
const Sound = {
  ctx: null,
  _c() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } }
    return this.ctx;
  },
  tone(freq, dur, type = 'sine', vol = 0.05) {
    const c = this._c(); if (!c) return;
    try {
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + dur);
    } catch (e) { /* ignoré */ }
  },
  ok() { if (settings().sound) this.tone(660, 0.04, 'triangle', 0.03); },
  err() { if (settings().sound) this.tone(150, 0.12, 'square', 0.04); },
  done() { if (settings().sound) { this.tone(523, 0.12, 'triangle', 0.05); setTimeout(() => this.tone(784, 0.18, 'triangle', 0.05), 110); } },
  tick() { this.tone(1000, 0.03, 'square', 0.03); },
};

/* ===== 03-detect.js ===== */
/* ============================================================
   Reconnaissance du clavier à partir d'une frappe.
   La touche physique (event.code) ne dépend pas de la disposition ; le
   caractère obtenu (event.key) en dépend. Quelques touches suffisent donc
   à distinguer AZERTY français, AZERTY belge et QWERTY, sans rien demander.
   ============================================================ */
'use strict';

/* touche physique → { caractère obtenu sans Maj : disposition } */
const LAYOUT_PROBES = {
  Digit8: { '_': 'azerty', '!': 'be', '8': 'qwerty' },
  Digit6: { '-': 'azerty', '§': 'be', '6': 'qwerty' },
  Equal: { '-': 'be' },
  Slash: { '!': 'azerty', '=': 'be', '/': 'qwerty' },
};

/** Disposition révélée par cette frappe, ou null si elle ne permet pas de conclure
 *  (Maj, AltGr, Verr Maj : les chiffres sortent à la place des signes). */
function detectLayout(e) {
  if (!e || e.shiftKey || e.ctrlKey || e.altKey || e.metaKey) return null;
  try {
    if (e.getModifierState && (e.getModifierState('CapsLock') || e.getModifierState('AltGraph'))) return null;
  } catch (err) { /* ignoré */ }
  const p = LAYOUT_PROBES[e.code];
  return (p && Object.prototype.hasOwnProperty.call(p, e.key)) ? p[e.key] : null;
}

/* ============================================================
   Rangs et jauges : où se situe ta vitesse et ta précision
   Les seuils sont ceux du site (vitesse ET précision). Le seul repère
   extérieur est la moyenne d'une étude publique, indiquée à titre de
   comparaison : ce n'est pas un classement de vraies personnes.
   ============================================================ */
'use strict';

const RANKS = [
  { id: 'apprenti', name: 'Apprenti', min: 0, acc: 0, blurb: 'Tu construis ton geste : la vitesse viendra après.' },
  { id: 'bronze', name: 'Bronze', min: 15, acc: 90, blurb: 'Premier palier : plus de 15 mots par minute avec une bonne précision.' },
  { id: 'argent', name: 'Argent', min: 30, acc: 92, blurb: 'Dans la fourchette basse des utilisateurs d\'ordinateur (30 à 60 mots par minute).' },
  { id: 'or', name: 'Or', min: 45, acc: 95, blurb: 'Autour de la moyenne de l\'étude de référence (environ 52 mots par minute).' },
  { id: 'platine', name: 'Platine', min: 60, acc: 96, blurb: 'Au-dessus de la moyenne : tu écris vite et proprement.' },
  { id: 'diamant', name: 'Diamant', min: 80, acc: 97, blurb: 'Parmi les plus rapides : la moyenne est loin derrière.' },
];
const STUDY_AVG = 52;
const STUDY_URL = 'https://userinterfaces.aalto.fi/136Mkeystrokes/';

/** Indice du plus haut rang dont la vitesse ET la précision sont atteintes. */
function rankIndex(wpm, acc) {
  let idx = 0;
  RANKS.forEach((k, i) => { if (wpm >= k.min && acc >= k.acc) idx = i; });
  return idx;
}
const rankFor = (wpm, acc) => RANKS[rankIndex(wpm, acc)];

/** Rang actuel : le meilleur des cinq derniers tests (d'au moins 25 secondes). */
function currentRank() {
  const tests = Store.d.history.filter(h => h.mode === 'test' && h.secs >= 25).slice(-5);
  let best = null;
  tests.forEach(t => {
    const idx = rankIndex(t.wpm, t.acc);
    if (!best || idx > best.idx || (idx === best.idx && t.wpm > best.t.wpm)) best = { idx, r: RANKS[idx], t };
  });
  return best;
}

function nextRankHint(wpm, acc, idx) {
  const nx = RANKS[idx + 1];
  if (!nx) return 'Tu es au rang le plus haut. Garde la régularité.';
  const parts = [];
  if (wpm < nx.min) { const d = nx.min - wpm; parts.push('encore ' + d + ' mot' + (d > 1 ? 's' : '') + ' par minute'); }
  if (acc < nx.acc) parts.push('une précision d\'au moins ' + nx.acc + ' % (tu es à ' + acc + ' %)');
  return 'Pour passer ' + nx.name + ' : ' + parts.join(' et ') + '.';
}

function medalHTML(rank, size = '') {

}

/** Jauge horizontale : segments colorés, échelle, repères et pastille « toi ». */
function gaugeHTML(o) {
  const span = o.max - o.min;
  const pct = v => clamp((v - o.min) / span * 100, 0, 100).toFixed(2);
  const segs = o.segs.map(s => `<i class="${s.cls}" style="--w:${s.to - s.from}" title="${esc(s.label)}"></i>`).join('');
  const scale = o.scale.map(v => `<span class="g-lab" style="left:${pct(v)}%">${v}</span>`).join('');
  const marks = (o.marks || []).map(m => `<span class="g-tick ${m.cls}" style="left:${pct(m.v)}%" title="${esc(m.label)}"></span>`).join('');
  const pin = o.value != null ? `<span class="g-pin" style="left:${pct(o.value)}%"><b>Toi : ${o.value}${o.unit || ''}</b></span>` : '';
  return `<div class="gauge" role="img" aria-label="${esc(o.aria || '')}"><div class="g-rail">${pin}<div class="g-track">${segs}</div>${marks}${scale}</div></div>`;
}

/* ===== 03-sync.js ===== */
/* ============================================================
   Synchronisation : double la sauvegarde du navigateur (localStorage)
   avec un document privé du compte, via la capacité `db` de claude.ai.
   Le site fonctionne à l'identique sans elle (fichier local, session
   fermée, capacité absente) : seule la sauvegarde en ligne disparaît.
   ============================================================ */
'use strict';

/** Fusionne deux sauvegardes sans rien perdre de l'une ni de l'autre. */
function mergeProgress(a, b) {
  a = a || {}; b = b || {};
  const newer = (a.updatedAt || 0) >= (b.updatedAt || 0) ? a : b;
  const older = newer === a ? b : a;
  const m = Object.assign(DEFAULTS(), older, newer);
  m.settings = Object.assign(DEFAULTS().settings, older.settings || {}, newer.settings || {});
  // leçons : on garde le meilleur résultat de chaque exercice
  m.lessons = {};
  for (const src of [older, newer]) {
    for (const lid of Object.keys(src.lessons || {})) {
      const dst = m.lessons[lid] || (m.lessons[lid] = { stages: {} });
      const st = (src.lessons[lid] || {}).stages || {};
      for (const i of Object.keys(st)) {
        const r = st[i], cur = dst.stages[i];
        if (!cur || r.stars > cur.stars || (r.stars === cur.stars && r.acc > cur.acc)) dst.stages[i] = r;
      }
    }
  }
  // historique : union, sans doublon
  const seen = new Set(), hist = [];
  for (const h of (a.history || []).concat(b.history || [])) {
    const k = h.t + ':' + (h.mode || '') + ':' + (h.ref || '');
    if (seen.has(k)) continue;
    seen.add(k); hist.push(h);
  }
  hist.sort((x, y) => x.t - y.t);
  m.history = hist.slice(-600);
  // jours : le plus long des deux
  m.days = {};
  for (const src of [a, b]) for (const d of Object.keys(src.days || {})) m.days[d] = Math.max(m.days[d] || 0, src.days[d]);
  // statistiques par touche : on garde, pour chaque touche, la série la mieux fournie
  m.keys = { azerty: {}, qwerty: {} };
  for (const lay of ['azerty', 'qwerty']) {
    const ka = (a.keys || {})[lay] || {}, kb = (b.keys || {})[lay] || {};
    for (const k of new Set(Object.keys(ka).concat(Object.keys(kb)))) {
      const ra = ka[k], rb = kb[k];
      const na = ra ? ra.h + ra.m : -1, nb = rb ? rb.h + rb.m : -1;
      m.keys[lay][k] = na >= nb ? ra : rb;
    }
  }
  m.best = {
    test: Math.max((a.best || {}).test || 0, (b.best || {}).test || 0),
    game: Math.max((a.best || {}).game || 0, (b.best || {}).game || 0),
  };
  const ba = a.baseline, bb = b.baseline;
  m.baseline = ba && bb ? (ba.t <= bb.t ? ba : bb) : (ba || bb || null);
  m.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  return m;
}

const SYNC_TEXT = {
  local: 'Enregistré sur cet appareil',
  connecting: 'Connexion à ta sauvegarde…',
  ok: 'Sauvegardé sur ton compte',
  saving: 'Sauvegarde en cours…',
  error: 'Sauvegarde en ligne indisponible, enregistré sur cet appareil',
};

const Sync = {
  state: 'local', ref: null, timer: null, busy: false, dirty: false, lastJSON: '',

  setState(s) {
    this.state = s;
    document.querySelectorAll('[data-sync]').forEach(el => {
      el.textContent = SYNC_TEXT[s] || SYNC_TEXT.local;
      el.className = 'sync ' + s;
    });
  },

  async init() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') { this.setState('local'); return; }
      this.setState('connecting');
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) { this.setState('local'); return; }
      const id = await user.id();
      if (!id) { this.setState('local'); return; }
      this.ref = db.doc('data/users/' + id + '/progress');
      const snap = await this.ref.get();
      let remote = null;
      if (snap.exists) {
        const body = snap.data() || {};
        try { remote = JSON.parse(body.payload); } catch (e) { remote = null; }
        this.lastJSON = typeof body.payload === 'string' ? body.payload : '';
      }
      if (remote && remote.settings) {
        const merged = mergeProgress(Store.d, remote);
        const changed = JSON.stringify(merged) !== JSON.stringify(Store.d);
        Store.d = merged;
        Store.persistLocal();
        if (changed) this.refreshView();
      }
      this.setState('ok');
      await this.push(true);
    } catch (e) {
      this.setState('error');
    }
  },

  /** Réaffiche la page courante si elle montre des progrès et qu'aucun exercice n'est en cours. */
  refreshView() {
    if (['home', 'cours', 'lecon', 'stats', 'test', 'reglages'].includes(App.page)) {
      try { applyTheme(); render(); } catch (e) { /* ignoré */ }
    }
  },

  schedule() {
    if (!this.ref) return;
    this.dirty = true;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.push(), 2500);
  },

  /** Écrit le document si son contenu a changé. `force` : première écriture après fusion. */
  async push(force) {
    if (!this.ref) return;
    if (this.busy) { this.dirty = true; return; }
    this.busy = true;
    try {
      do {
        this.dirty = false;
        let json = JSON.stringify(Store.d);
        if (json.length > 230000) json = JSON.stringify(Object.assign({}, Store.d, { history: Store.d.history.slice(-200) }));
        if (json !== this.lastJSON) {
          this.setState('saving');
          await this.ref.set({ v: 1, updatedAt: Store.d.updatedAt || Date.now(), payload: json });
          this.lastJSON = json;
        }
      } while (this.dirty);
      this.setState('ok');
    } catch (e) {
      this.setState('error');
    } finally {
      this.busy = false;
    }
  },

  /** Envoie tout de suite si des changements attendent (fermeture ou changement d'onglet). */
  flush() {
    if (this.ref && this.dirty) { clearTimeout(this.timer); this.push(); }
  },
};

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Sync.flush(); });
window.addEventListener('pagehide', () => Sync.flush());

/* ============================================================
   Composants : clavier virtuel, mains, moteur de frappe
   ============================================================ */
'use strict';

/* ---------- Clavier virtuel ---------- */
function kbHTML(id, o = {}) {
  const def = LAYOUT_DEFS[id];
  const bumps = def.bumps;
  let h = `<div class="kb${o.compact ? ' kb-compact' : ''}" data-layout="${id}" role="img" aria-label="Clavier ${esc(def.name)}">`;
  const mod = (m, shift) => `<div class="key mod" style="--w:${m[1]}"${shift ? ` data-k="${shift}"` : ''}><span class="b">${esc(m[0])}</span></div>`;
  def.rows.forEach((row, r) => {
    const m = def.mods[r] || {};
    h += '<div class="kb-row">';
    if (m.pre) h += mod(m.pre, r === 3 ? '__shiftL' : '');
    row.forEach(([b, s, f]) => {
      // µ (touche belge) est une lettre pour Unicode, mais sa « majuscule » serait un Μ grec
      const letter = isLetter(b) && b !== 'µ';
      const bump = bumps.includes(b) && r === 2;
      h += `<div class="key f-${f}${bump ? ' bump' : ''}" data-k="${esc(b)}" data-f="${f}" style="--w:1" title="${esc(FINGERS[f].n)}">` +
        (letter ? `<span class="b lt">${esc(b.toUpperCase())}</span>`
          : `<span class="s">${esc(s)}</span><span class="b">${esc(b)}</span>`) + '</div>';
    });
    if (m.post) h += mod(m.post, r === 3 ? '__shiftR' : '');
    h += '</div>';
  });
  h += `<div class="kb-row"><i style="--w:3.6"></i><div class="key f-th space" data-k=" " data-f="th" style="--w:7.2" title="Pouce"><span class="b">espace</span></div><i style="--w:4.2"></i></div>`;
  return h + '</div>';
}

function Keyboard(root) {
  const id = root.dataset.layout;
  const L = LAYOUTS[id];
  const map = new Map();
  $$('.key[data-k]', root).forEach(el => map.set(el.dataset.k, el));
  const timers = new Map();
  const api = {
    root, map, id, L,
    clear(cls) { $$('.' + cls, root).forEach(e => e.classList.remove(cls)); },
    mark(k, cls, on = true) { const e = map.get(k); if (e) e.classList.toggle(cls, on); },
    setTarget(ch, deadPending = false) {
      api.clear('is-target'); api.clear('is-shift');
      if (ch == null) return;
      const info = L.map.get(ch);
      if (!info) return;
      if (info.dead && !deadPending) { api.mark('^', 'is-target'); return; }
      api.mark(info.base, 'is-target');
      if (info.shift) api.mark(shiftFingerFor(info) === 'rp' ? '__shiftR' : '__shiftL', 'is-shift');
    },
    /** Marque les touches « nouvelles » (en couleur) et estompe les autres. */
    setFocus(chars) {
      api.clear('is-new'); api.clear('is-dim');
      const set = new Set([...chars].map(c => { const i = L.map.get(c); return i ? i.base : c; }));
      root.classList.toggle('has-focus', set.size > 0);
      map.forEach((el, k) => { if (set.has(k)) el.classList.add('is-new'); });
    },
    flash(ch, ok) {
      const info = L.map.get(ch);
      if (!info) return;
      const el = map.get(info.base); if (!el) return;
      const cls = ok ? 'is-hit' : 'is-miss';
      el.classList.remove('is-hit', 'is-miss'); void el.offsetWidth; el.classList.add(cls);
      clearTimeout(timers.get(el));
      timers.set(el, setTimeout(() => el.classList.remove(cls), 220));
    },
    /** Carte de chaleur : values = { base: 0..1 } */
    heat(values) {
      map.forEach((el, k) => {
        const v = values[k];
        if (v == null) { el.style.removeProperty('--heat'); el.classList.remove('has-heat'); }
        else { el.style.setProperty('--heat', String(v)); el.classList.add('has-heat'); }
      });
      root.classList.toggle('heatmap', Object.keys(values).length > 0);
    },
  };
  return api;
}

/* ---------- Mains ---------- */
function handsHTML() {
  const f = (k, cls = '') => `<i class="fg ${cls || 'f-' + k}" data-f="${k}"></i>`;
  return `<div class="hands" aria-hidden="true">
    <div class="hand hl">${f('lp')}${f('lr')}${f('lm')}${f('li')}${f('th', 'th')}</div>
    <div class="hand hr">${f('th', 'th')}${f('ri')}${f('rm')}${f('rr')}${f('rp')}</div>
  </div>`;
}
function setHands(root, fingers) {
  const on = new Set(fingers.filter(Boolean));
  $$('.fg', root).forEach(el => el.classList.toggle('on', on.has(el.dataset.f)));
}
function legendHTML() {
  return '<ul class="legend" aria-label="Légende des doigts">' + FINGER_ORDER.map(f =>
    `<li><i class="sw f-${f}"></i>${esc(FINGERS[f].n)}</li>`).join('') + '<li><i class="sw f-th"></i>Pouces</li></ul>';
}

/* ---------- Clavier de l'écran (téléphone, tablette sans clavier) ----------
   Un clavier physique passe par keydown, comme avant. Le clavier de l'écran,
   lui, n'apparaît que si un champ a le focus, et Android ne dit pas quelle
   touche a été tapée dans keydown : on lit donc ce qui s'ajoute dans un champ
   invisible posé sur la zone de frappe. */
const isTouchOnly = () => { try { return matchMedia('(hover: none) and (pointer: coarse)').matches; } catch (e) { return false; } };
const SOFT_MAP = { '’': "'", '‘': "'", 'ʼ': "'", '“': '"', '”': '"', ' ': ' ' };
function softInput(host, onChar) {
  const t = document.createElement('textarea');
  t.className = 'soft-input';
  t.rows = 1;
  t.setAttribute('aria-label', 'Zone de frappe');
  for (const [a, v] of [['autocapitalize', 'off'], ['autocomplete', 'off'], ['autocorrect', 'off'], ['spellcheck', 'false'], ['enterkeyhint', 'enter']]) t.setAttribute(a, v);
  host.appendChild(t);
  let last = '', composing = false;
  t.addEventListener('compositionstart', () => { composing = true; });
  t.addEventListener('compositionend', () => { composing = false; });
  t.addEventListener('input', () => {
    const v = t.value;
    // seuls les caractères ajoutés au bout comptent : une correction automatique qui remplace un mot est ignorée
    if (v.length > last.length && v.startsWith(last)) for (const ch of v.slice(last.length)) { if (ch !== '\n') onChar(SOFT_MAP[ch] || ch); }
    last = v;
    if (!composing && v.length > 40) { t.value = ''; last = ''; }
  });
  return {
    focus() { try { t.focus({ preventScroll: true }); } catch (e) { t.focus(); } },
    blur() { t.blur(); },
  };
}

/* ---------- Moteur de frappe ---------- */
function sessionTemplate(cfg) {
  const showKb = cfg.showKeyboard !== false && settings().showKeyboard;
  const showHands = cfg.showHands !== false && settings().showHands;
  return `
  <div class="session" data-state="ready">
    <div class="s-top">
      <div class="s-title">
        <span class="kicker">${esc(cfg.kicker || '')}</span>
        <h2>${esc(cfg.title || '')}</h2>
        ${cfg.sub ? `<p class="muted">${esc(cfg.sub)}</p>` : ''}
      </div>
      <div class="s-actions">
        <button class="btn ghost" type="button" data-s="restart">Recommencer <kbd>Entrée</kbd></button>
        <button class="btn ghost" type="button" data-s="exit">Quitter <kbd>Échap</kbd></button>
      </div>
    </div>
    <div class="hud" role="status" aria-live="off">
      <div class="hud-i"><span class="v" data-hud="wpm">–</span><span class="l">mots / min</span></div>
      <div class="hud-i"><span class="v" data-hud="acc">100</span><span class="l">% précision</span></div>
      <div class="hud-i"><span class="v" data-hud="time">${cfg.timeLimit ? fmtTime(cfg.timeLimit) : '0:00'}</span><span class="l">${cfg.timeLimit ? 'restant' : 'temps'}</span></div>
      <div class="hud-i"><span class="v" data-hud="err">0</span><span class="l">erreurs</span></div>
      <div class="prog" aria-hidden="true"><i data-hud="bar"></i></div>
    </div>
    <div class="sheet" data-sheet>
      <div class="viewport"><div class="inner" data-txt></div></div>
      <div class="sheet-hint" data-hint>${isTouchOnly() ? 'Touche le texte pour faire apparaître le clavier, puis tape la première lettre.' : 'Pose tes doigts, puis tape la première touche pour démarrer.'}</div>
    </div>
    <div class="guide">
      <div class="next" data-next></div>
      ${showHands ? handsHTML() : ''}
      ${showKb ? kbHTML(cfg.layoutId || layoutId(), { compact: true }) : ''}
    </div>
  </div>`;
}

function mountSession(root, cfg) {
  const id = cfg.layoutId || layoutId();
  const L = LAYOUTS[id];
  const stopOnError = cfg.stopOnError != null ? cfg.stopOnError : settings().stopOnError;
  root.innerHTML = sessionTemplate(cfg);
  const el = $('.session', root);
  const inner = $('[data-txt]', el), sheet = $('[data-sheet]', el), hint = $('[data-hint]', el), next = $('[data-next]', el);
  const hud = k => $(`[data-hud="${k}"]`, el);
  const kbRoot = $('.kb', el);
  const kb = kbRoot ? Keyboard(kbRoot) : null;
  if (kb && cfg.focusKeys) kb.setFocus(cfg.focusKeys);
  const handsRoot = $('.hands', el);

  let text = normalizeText(cfg.text);
  let chars = [...text];
  const spans = [];
  let pos = 0, started = false, t0 = 0, hits = 0, errs = 0, lastOk = 0, finished = false, pendingDead = false, mismatch = false, lastKey = null;
  const miss = {};
  let tick = null, pitch = 0, curRow = 0, stopMetro = null;

  function renderAppend(str) {
    const frag = document.createDocumentFragment();
    let cur = null;
    for (const ch of str) {
      if (!cur) { cur = document.createElement('span'); cur.className = 'w'; frag.appendChild(cur); }
      const s = document.createElement('span');
      s.className = 'c' + (ch === ' ' ? ' sp' : '');
      s.textContent = ch === ' ' ? ' ' : ch;
      cur.appendChild(s); spans.push(s);
      if (ch === ' ') cur = null;
    }
    inner.appendChild(frag);
  }
  renderAppend(text);
  if (!settings().showSpaces) sheet.classList.add('no-spaces');
  if (cfg.blind) sheet.classList.add('blind');
  const sizeMap = { s: '1.15rem', m: '1.5rem', l: '1.95rem' };
  sheet.style.setProperty('--fs', sizeMap[settings().textSize || 'm'] || '1.5rem');

  function elapsedMs() { return started ? performance.now() - t0 : 0; }
  function wpm() { const m = elapsedMs() / 60000; return m > 0.04 ? Math.round((hits / 5) / m) : null; }
  function acc() { const t = hits + errs; return t ? Math.round(1000 * hits / t) / 10 : 100; }

  function updateHud() {
    const w = wpm();
    hud('wpm').textContent = w == null ? '–' : w;
    hud('acc').textContent = acc() % 1 === 0 ? acc() : acc().toFixed(1);
    hud('err').textContent = errs;
    let t = elapsedMs() / 1000;
    if (cfg.timeLimit) {
      hud('time').textContent = fmtTime(Math.max(0, Math.ceil(cfg.timeLimit - t)));
      hud('bar').style.width = clamp(100 * t / cfg.timeLimit, 0, 100) + '%';
    } else {
      hud('time').textContent = fmtTime(t);
      hud('bar').style.width = clamp(100 * pos / Math.max(1, chars.length), 0, 100) + '%';
    }
  }

  function updateGuide() {
    const ch = chars[pos];
    if (ch == null) return;
    const info = L.map.get(ch);
    if (kb) kb.setTarget(ch, pendingDead);
    const fingers = [];
    let label = '';
    if (!info) { label = `Tape ${kbd(ch)}`; }
    else if (info.dead && !pendingDead) {
      const caret = L.map.get('^');
      fingers.push(caret.f);
      label = `Touche ${kbd('^')} (touche morte), puis ${kbd(info.base)}`;
    } else {
      fingers.push(info.f);
      if (info.shift) {
        const sf = shiftFingerFor(info); fingers.push(sf);
        label = `<kbd>Maj</kbd> (${FINGERS[sf].n.toLowerCase()}) + ${kbd(info.base)} (${FINGERS[info.f].n.toLowerCase()})`;
        if (isLetter(ch)) label = `Majuscule : <kbd>Maj</kbd> (${FINGERS[sf].n.toLowerCase()}) + ${kbd(ch)}`;
      } else {
        label = ch === ' ' ? 'Barre d\'espace, avec le pouce' : `${kbd(ch)}, ${FINGERS[info.f].n.toLowerCase()}`;
      }
    }
    next.innerHTML = `<span class="l">Prochaine touche</span><span class="t">${label}</span>`;
    if (handsRoot) setHands(handsRoot, fingers);
  }

  function setCurrent() {
    spans.forEach((s, i) => { if (s.classList.contains('cur') && i !== pos) s.classList.remove('cur'); });
    const s = spans[pos];
    if (s) {
      s.classList.add('cur');
      const wrap = s.parentNode;
      if (!pitch) { const lh = parseFloat(getComputedStyle(inner).lineHeight); pitch = lh || 48; }
      const row = Math.round(wrap.offsetTop / pitch);
      if (row !== curRow) {
        curRow = row;
        inner.style.transform = `translateY(${-Math.max(0, row - 1) * pitch}px)`;
      }
    }
  }

  function maybeExtend() {
    if (!cfg.extend) return;
    if (chars.length - pos > 90) return;
    const more = cfg.extend();
    if (!more) return;
    const add = ' ' + normalizeText(more);
    chars = chars.concat([...add]);
    text += add;
    renderAppend(add);
  }

  function finish(reason) {
    if (finished) return;
    finished = true;
    clearInterval(tick);
    if (stopMetro) stopMetro();
    window.removeEventListener('keydown', onKey, true);
    window.removeEventListener('keyup', onKeyUp, true);
    soft.blur();
    el.dataset.state = 'done';
    const secs = Math.max(0.5, elapsedMs() / 1000);
    const res = {
      secs, hits, errs, reason,
      acc: acc(), wpm: Math.round((hits / 5) / (secs / 60)),
      cpm: Math.round(hits / (secs / 60)),
      len: chars.length, miss,
    };
    Sound.done();
    cfg.onFinish && cfg.onFinish(res);
  }

  function onKeyUp(e) {
    // évite qu'un bouton focalisé soit activé par la barre d'espace
    if (e.key === ' ' && !finished) e.preventDefault();
  }

  function onKey(e) {
    if (finished) return;
    if (e.key === 'Escape') { e.preventDefault(); destroy(); cfg.onExit && cfg.onExit(); return; }
    if ((e.ctrlKey || e.altKey || e.metaKey) && !(e.getModifierState && e.getModifierState('AltGraph'))) return;
    const k = e.key;
    if (k === 'Enter' || k === 'Tab') {
      // aucune frappe d'exercice n'utilise ces touches : elles servent à recommencer
      e.preventDefault();
      if (e.repeat) return;
      destroy();
      cfg.onRestart ? cfg.onRestart() : mountSession(root, cfg);
      return;
    }
    if (k === 'Dead') {
      e.preventDefault();
      if (!started) { started = true; t0 = performance.now(); el.dataset.state = 'run'; hint.classList.add('hide'); }
      pendingDead = true; updateGuide(); return;
    }
    if (k === 'Shift' || k === 'Control' || k === 'Alt' || k === 'AltGraph' || k === 'CapsLock' || k === 'Meta' || k === 'Tab' ||
      k === 'ContextMenu' || k === 'OS' || k === 'Unidentified' || /^F\d+$/.test(k)) return;
    if (k.length !== 1) { if (k === 'Backspace' || k === 'Enter') e.preventDefault(); return; }
    e.preventDefault();
    if (e.getModifierState && e.getModifierState('CapsLock') && /[a-zà-ÿ]/.test(chars[pos] || '') && k !== chars[pos]) {
      hint.textContent = 'La touche Verr Maj est activée : appuie dessus pour la désactiver.'; hint.classList.remove('hide'); hint.classList.add('warn');
    }
    lastKey = { ch: k, t: performance.now() };
    typeChar(k, e);
  }

  /** Une frappe, qu'elle vienne d'un clavier physique (e) ou du clavier de l'écran (e = null). */
  function typeChar(k, e) {
    const now = performance.now();
    if (!started) { started = true; t0 = now; lastOk = now; el.dataset.state = 'run'; hint.classList.add('hide'); }
    if (e && !mismatch) {
      // la frappe révèle un autre clavier que celui du réglage : le clavier à l'écran ne serait pas juste
      const seen = detectLayout(e);
      if (seen && seen !== id) {
        mismatch = true;
        hint.textContent = `Ton clavier ressemble à un ${LAYOUT_DEFS[seen].name}, mais le site est réglé sur ${LAYOUT_DEFS[id].name} : le clavier à l'écran ne correspond pas. Corrige-le dans Réglages, rubrique Clavier.`;
        hint.classList.remove('hide'); hint.classList.add('warn');
      }
    }
    const expected = chars[pos];
    pendingDead = false;
    if (k === expected) {
      hits++;
      addKeyStat(id, expected, true, now - lastOk);
      lastOk = now;
      const s = spans[pos]; s.classList.remove('cur', 'bad'); s.classList.add(s.dataset.err ? 'fixed' : 'ok');
      if (kb) kb.flash(expected, true);
      pos++;
      Sound.ok();
      maybeExtend();
      if (pos >= chars.length) { updateHud(); finish('end'); return; }
      setCurrent(); updateGuide(); updateHud();
    } else {
      errs++;
      miss[expected] = (miss[expected] || 0) + 1;
      addKeyStat(id, expected, false, 0);
      Sound.err();
      if (kb) { kb.flash(k, false); }
      const s = spans[pos];
      s.dataset.err = '1';
      s.classList.add('bad');
      sheet.classList.remove('shake'); void sheet.offsetWidth; sheet.classList.add('shake');
      if (!stopOnError) {
        s.classList.remove('cur', 'bad'); s.classList.add('wrong');
        pos++;
        maybeExtend();
        if (pos >= chars.length) { updateHud(); finish('end'); return; }
        setCurrent(); updateGuide();
      }
      updateHud();
    }
  }

  function destroy() {
    finished = true;
    clearInterval(tick);
    if (stopMetro) stopMetro();
    window.removeEventListener('keydown', onKey, true);
    window.removeEventListener('keyup', onKeyUp, true);
    soft.blur();
  }

  $('[data-s="exit"]', el).addEventListener('click', () => { destroy(); cfg.onExit && cfg.onExit(); });
  $('[data-s="restart"]', el).addEventListener('click', () => { destroy(); cfg.onRestart ? cfg.onRestart() : mountSession(root, cfg); });

  // clavier de l'écran : une frappe déjà comptée par keydown n'est pas recomptée
  const soft = softInput(sheet, ch => {
    if (finished) return;
    if (lastKey && lastKey.ch === ch && performance.now() - lastKey.t < 150) { lastKey = null; return; }
    typeChar(ch, null);
  });
  sheet.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') soft.focus(); });

  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (isTouchOnly()) soft.focus();
  window.addEventListener('keydown', onKey, true);
  window.addEventListener('keyup', onKeyUp, true);
  tick = setInterval(() => {
    if (!started || finished) return;
    updateHud();
    if (cfg.timeLimit && elapsedMs() >= cfg.timeLimit * 1000) finish('time');
  }, 200);
  if (cfg.rhythm) {
    const ms = 60000 / cfg.rhythm;
    const m = setInterval(() => { Sound.tick(); const p = $('.prog', el); if (p) { p.classList.remove('pulse'); void p.offsetWidth; p.classList.add('pulse'); } }, ms);
    stopMetro = () => clearInterval(m);
  }
  setCurrent(); updateGuide(); updateHud();
  return { destroy };
}

/* ---------- Petits composants HTML ---------- */
function starsHTML(n, max = 3) {
  let s = '<span class="stars" aria-label="' + n + ' sur ' + max + ' étoiles">';
  for (let i = 0; i < max; i++) s += `<svg viewBox="0 0 20 20" class="${i < n ? 'on' : ''}" aria-hidden="true"><path d="M10 1.6l2.5 5.5 6 .7-4.4 4.1 1.2 5.9L10 14.8 4.7 17.8l1.2-5.9L1.5 7.8l6-.7z"/></svg>`;
  return s + '</span>';
}
function ringHTML(pct, label, size = 76) {
  const r = 30, c = 2 * Math.PI * r, off = c * (1 - clamp(pct, 0, 100) / 100);
  return `<div class="ring" style="--s:${size}px"><svg viewBox="0 0 76 76" aria-hidden="true"><circle class="bg" cx="38" cy="38" r="${r}"/><circle class="fg" cx="38" cy="38" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg><span>${esc(label)}</span></div>`;
}
