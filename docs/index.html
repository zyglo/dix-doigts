/* ---------- Reconnaissance du clavier (accueil et réglages) ---------- */
/** Message affiché après un changement de disposition, tant qu'on reste sur la page. */
function kbNoteHTML() {
  const n = App.kbNote;
  return n ? `<div class="note tip kb-note" role="status"><b>${esc(n.title)}</b> ${esc(n.text)}</div>` : '';
}
/** Règle la disposition, la marque comme vérifiée et réaffiche la page. */
function setKeyboard(id, how) {
  setLayoutId(id);
  settings().kbChecked = true;
  Store.save();
  App.kbNote = { title: (how === 'auto' ? 'Clavier reconnu : ' : 'Clavier réglé : ') + LAYOUT_DEFS[id].name + '.', text: LAYOUT_DEFS[id].hint + '. Le clavier à l\'écran, les doigts et les leçons suivent ce clavier ; tu peux le changer dans les réglages.' };
  render();
}
/** Encart de l'accueil, tant que la disposition n'a été ni reconnue ni choisie. */
function kbCheckHTML() {
  if (settings().kbChecked) return '';
  const cur = layoutId();
  const opts = Object.values(LAYOUT_DEFS).map(l =>
    `<button class="btn${l.id === cur ? ' ghost' : ''}" type="button" data-kb="${l.id}">${esc(l.name)}</button>`).join('');
  return `<section class="panel kb-check" aria-labelledby="h-kbc">
    <h2 id="h-kbc">Quel est ton clavier ?</h2>
    <p>Les signes de ponctuation ne sont pas au même endroit sur un clavier français, belge ou QWERTY. Pour que le clavier à l'écran et les consignes soient justes, appuie sur la touche <b>8</b> de la rangée du haut, sans Maj : le site reconnaît ta disposition tout seul.</p>
    <p class="small muted" data-kbc-status role="status">En attente de ta frappe. Si rien ne se passe, clique une fois dans la page puis recommence, ou choisis à la main :</p>
    <div class="cta">${opts}</div>
  </section>`;
}
/** Écoute la frappe : les touches 8, 6, = et ! suffisent à reconnaître la disposition. */
function bindKbCheck(root) {
  const status = $('[data-kbc-status]', root);
  const onKey = e => {
    const t = e.target;
    if (t && t.tagName && (t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' ||
      (t.tagName === 'INPUT' && !['radio', 'checkbox', 'button', 'file', 'range'].includes(t.type)))) return;
    const seen = detectLayout(e);
    if (!seen) return;
    if (seen === layoutId() && settings().kbChecked) {
      if (status) status.textContent = 'Confirmé : ' + LAYOUT_DEFS[seen].hint + '.';
      return;
    }
    setKeyboard(seen, 'auto');
  };
  window.addEventListener('keydown', onKey);
  return () => window.removeEventListener('keydown', onKey);
}

    offs.push(() => clearInterval(t));
  },
};

      ['Où sont passés le point d\'exclamation et le tiret ?', 'Ils ne sont pas au même endroit sur tous les AZERTY. Sur un clavier français, ! est la dernière touche de la rangée du bas et le tiret est sur la touche 6. Sur un clavier belge, ! est sur la touche 8 et le tiret est tout à droite de la rangée des chiffres. Le clavier à l\'écran du site montre toujours l\'emplacement réel de la disposition choisie.'],

      <h1>Comprendre avant de s'entraîner</h1>
      <p class="lead">Dix minutes de lecture ici t'éviteront des semaines de mauvaises habitudes. Tu peux revenir sur cette page à tout moment.</p>

        <thead><tr><th></th><th>Deux index</th><th>Dix doigts</th></tr></thead>

        <div class="tile"><h3>Doigts</h3><p>Courbés, comme si tu tenais une petite balle. Tu frappes avec le bout du doigt, pas avec la pulpe à plat.</p></div>
        <div class="tile"><h3>Écran</h3><p>À hauteur des yeux, à une longueur de bras environ. Le haut de l'écran est à peu près au niveau du regard.</p></div>

    <section class="band" id="g-depart">

          <p class="prose">Les touches ${kbd('f')} et ${kbd('j')} ont un petit relief : c'est ton repère. Quand tu perds la position, tes index les retrouvent sans les yeux. Après chaque frappe, le doigt revient sur sa touche de base.</p>
          <div class="note tip"><b>À essayer maintenant.</b> Ferme les yeux, pose les mains sur le clavier, puis cherche les deux reliefs avec tes index. Les autres doigts tombent à côté.</div>

    <section class="band" id="g-carte">
      <h2>Quel doigt pour quelle touche ?</h2>

      <div class="kb-wrap" id="kbMap">${kbHTML(id)}</div>
      ${legendHTML()}
      <div class="panel key-info" id="keyInfo" aria-live="polite"><span class="muted">Clique sur une touche du clavier.</span></div>

    <section class="band" id="g-mot">
      <h2>Décortiquer un mot</h2>

      <div class="panel">
        <label class="field" for="wordIn"><span>Ton mot</span><input id="wordIn" type="text" value="bonjour" maxlength="40" autocomplete="off" spellcheck="false"></label>

    <section class="band" id="g-regles">
      <h2>Les huit règles d'or</h2>
      <div class="grid g4 rules">
        <div class="tile"><h3>Les yeux sur l'écran</h3><p>Ne regarde pas le clavier, même quand tu hésites. Tes doigts retrouvent la touche à force d'essais : c'est ainsi que la mémoire se construit.</p></div>
        <div class="tile"><h3>Chaque doigt a son territoire</h3><p>Une touche, un doigt. Même si un autre doigt est plus proche, résiste : c'est ce qui rend la frappe automatique.</p></div>
        <div class="tile"><h3>Retour à la base</h3><p>Après chaque frappe, le doigt revient sur la rangée de base. Les repères sous tes index font le reste.</p></div>
        <div class="tile"><h3>Précision d'abord</h3><p>La vitesse est la conséquence de la précision. Vise 95 %, puis accélère doucement.</p></div>
        <div class="tile"><h3>Un rythme régulier</h3><p>Mieux vaut un tempo constant et calme que des rafales suivies de pauses.</p></div>
        <div class="tile"><h3>Un seul pouce pour l'espace</h3><p>Choisis celui qui te convient (souvent le droit) et garde-le. Un pouce, une habitude.</p></div>
        <div class="tile"><h3>Maj du côté opposé</h3><p>Pour une majuscule, tu maintiens Maj de la main qui ne tape pas la lettre.</p></div>
        <div class="tile"><h3>Court, et chaque jour</h3><p>Quinze à vingt minutes quotidiennes valent mieux qu'une heure le dimanche : le geste se consolide entre les séances.</p></div>

      <div class="grid g2">
        <div>
          <h3>Ce qui va se passer</h3>
          <p class="prose">Au début, taper avec dix doigts sera <b>plus lent</b> que ta méthode actuelle. Ce n'est pas un échec, c'est le signe que ton cerveau construit une nouvelle carte. Après quelques semaines, les deux courbes se croisent, puis tu la dépasses.</p>
          <h3>Astuces pour casser l'habitude</h3>
          <ul class="ticks">
            <li>Couvre tes mains avec un torchon ou une feuille pendant les exercices : tu ne peux plus regarder.</li>
            <li>Garde le clavier à portée de main, pas sur les genoux : la position doit être stable.</li>
            <li>Si tu te surprends à repartir sur tes index, arrête-toi, reviens à F et J, puis recommence.</li>
            <li>Ne triche pas pendant les exercices : un exercice fait à deux index renforce l'ancienne habitude.</li>
            <li>Dans la vie courante, tape comme avant au début. Change progressivement quand la rangée du haut est acquise.</li>
          </ul>
        </div>
        <div>
          <h3>Un plan réaliste</h3>
          <div class="plan">
            ${plan.map(p => `<div class="plan-row"><div class="pl-w"><b>${esc(p[0])}</b><span>${esc(p[1])}</span></div><div class="pl-d"><span class="pill">${esc(p[2])}</span><p>${esc(p[3])}</p></div></div>`).join('')}
          </div>
        </div>
      </div>
    </section>

    <section class="band" id="g-chauffe">
      <h2>Échauffer les mains</h2>
      <div class="grid g3 tiles">
        <div class="tile"><h3>Le poing et l'étoile</h3><p>Ferme les poings, puis ouvre grand les doigts, comme une étoile. Dix fois, doucement.</p></div>
        <div class="tile"><h3>Les poignets</h3><p>Bras tendus devant toi, fais des cercles lents avec les poignets, dans les deux sens.</p></div>
        <div class="tile"><h3>Le piano</h3><p>Pose les mains à plat sur la table, puis soulève les doigts un par un, comme si tu jouais d'un piano muet.</p></div>
      </div>
    </section>

    <section class="band" id="g-faq">
      <h2>Questions fréquentes</h2>
      <div class="faq">
        ${faq.map(q => `<details><summary>${esc(q[0])}</summary><p>${esc(q[1])}</p></details>`).join('')}
      </div>
      <div class="cta-row"><button class="btn primary" type="button" data-go="cours">Commencer les leçons</button></div>
    </section>`;
  },
  mount(root) {
    const id = layoutId();
    const L = LAYOUTS[id];
    // position de départ : mettre en avant la rangée de base
    const kh = Keyboard($('#kbHome .kb', root));
    kh.setFocus(LAYOUT_DEFS[id].home);
    // carte des doigts : clic sur une touche
    const km = $('#kbMap .kb', root);
    km.addEventListener('click', e => {
      const k = e.target.closest('.key[data-k]');
      if (!k) return;
      const ch = k.dataset.k;
      const box = $('#keyInfo', root);
      if (ch.startsWith('__') || !L.map.has(ch)) { box.innerHTML = '<span class="muted">Cette touche n\'est pas une touche de caractère. Pour une majuscule, utilise la touche Maj du côté opposé.</span>'; return; }
      const i = L.map.get(ch);
      const f = FINGERS[i.f];
      const extra = LAYOUT_DEFS[id].rows[i.r] ? ROW_NAMES[i.r] : 'barre d\'espace';
      const s = LAYOUT_DEFS[id].rows[i.r] && LAYOUT_DEFS[id].rows[i.r].find(x => x[0] === ch);
      box.innerHTML = `<span class="kc f-${i.f}"><kbd>${esc(keyLabel(ch))}</kbd></span> <b>${esc(f.n)}</b> <span class="muted">· ${esc(extra)}${s && s[1] && !isLetter(ch) ? ' · avec Maj : ' + esc(s[1]) : ''}</span>`;
    });
    // décortiquer un mot
    const inp = $('#wordIn', root), chain = $('#chain', root), sum = $('#chainSum', root);
    const draw = () => {
      const w = normalizeText(inp.value || '');
      let h = '', alt = 0, pairs = 0, prevHand = null;
      for (const ch of w) {
        const i = L.map.get(ch);
        if (ch === ' ') { h += '<span class="ch sp"><b>␣</b><i>pouce</i></span>'; prevHand = null; continue; }
        if (!i) { h += `<span class="ch"><b>${esc(ch)}</b><i>?</i></span>`; continue; }
        const hand = FINGERS[i.f].hand;
        if (prevHand) { pairs++; if (hand !== prevHand) alt++; }
        prevHand = hand;
        h += `<span class="ch f-${i.f}"><b>${esc(ch)}</b><i>${esc(FINGERS[i.f].s)}</i>${i.shift ? '<u>Maj</u>' : ''}</span>`;
      }
      chain.innerHTML = h || '<span class="muted">Écris quelque chose…</span>';
      sum.textContent = pairs ? `${alt} changement${alt > 1 ? 's' : ''} de main sur ${pairs} enchaînement${pairs > 1 ? 's' : ''}. Plus les mains alternent, plus le mot est fluide.` : '';
    };
    inp.addEventListener('input', draw);
    draw();
  },
};

PAGES.cours = {
  html() {
    const id = layoutId();
    const ls = lessonsFor(id);
    const nx = nextLesson(id);
    const prog = courseProgress(id);
    let n = 0;
    const modules = MODULES.map(m => {
      const lsm = ls.filter(l => l.m === m.id);
      if (!lsm.length) return '';
      const cards = lsm.map(l => {
        n = ls.indexOf(l) + 1;
        const st = lessonState(l, id);
        const keys = keysOf(l, id);
        const status = st.complete ? 'done' : (st.done > 0 ? 'part' : (nx && nx.id === l.id ? 'next' : 'todo'));
        return `<button class="lesson-card ${status}" type="button" data-go="lecon:${l.id}">
          <span class="lc-n">${n}</span>
          <span class="lc-main">
            <span class="lc-title">${esc(lessonTitle(l, id))}</span>
            <span class="lc-short">${esc(l.short || '')}</span>
            ${keys ? `<span class="lc-keys">${keycapsHTML(keys.length > 12 ? keys.slice(0, 12) : keys, id)}</span>` : ''}
          </span>
          <span class="lc-side">${starsHTML(st.total ? Math.round(3 * st.stars / st.max) : 0)}<span class="small muted">${st.done} / ${st.total}</span></span>
        </button>`;
      }).join('');
      return `<section class="module" aria-labelledby="m-${m.id}">
        <div class="module-head"><h2 id="m-${m.id}">${esc(m.title)}</h2><span class="pill">${esc(m.time)}</span></div>
        <p class="muted">${esc(m.blurb)}</p>
        <div class="lesson-list">${cards}</div>
      </section>`;
    }).join('');
    return `
    <header class="page-head">
      <p class="kicker">Le parcours</p>
      <h1>${ls.length} leçons, dans l'ordre</h1>
      <p class="lead">Chaque leçon explique le geste, puis propose des exercices dont le texte change à chaque fois. Tu valides un exercice avec ${settings().passAcc} % de précision ou plus. L'ordre est conseillé, mais rien n'est verrouillé.</p>
      <div class="cta">
        ${nx ? `<button class="btn primary lg" type="button" data-go="lecon:${nx.id}">${prog.done ? 'Continuer' : 'Commencer'} : ${esc(lessonTitle(nx, id))}</button>` : ''}
        <span class="muted">${prog.done} leçons terminées sur ${prog.total}</span>
      </div>
    </header>
    ${modules}`;
  },
};

PAGES.lecon = {
  html(param) {
    const id = layoutId();
    const ls = lessonsFor(id);
    const lesson = ls.find(l => l.id === param) || ls[0];
    const L = LAYOUTS[id];
    const idx = ls.indexOf(lesson);
    const keys = keysOf(lesson, id);
    const stages = stagesOf(lesson, id);
    const st = lessonState(lesson, id);
    const mod = MODULES.find(m => m.id === lesson.m);
    const prev = ls[idx - 1], nxt = ls[idx + 1];
    const body = k => fillKeys(tx(lesson[k], id) || '', keys);
    // doigt par doigt
    const fingerRows = [...keys].filter(ch => L.map.has(ch)).map(ch => {
      const i = L.map.get(ch);
      const rowName = i.dead ? 'après la touche ^' : ROW_NAMES[i.r];
      const sh = i.shift ? ` · avec <kbd>Maj</kbd> (${FINGERS[shiftFingerFor(i)].n.toLowerCase()})` : '';
      return `<li><span class="kc f-${i.f}"><kbd>${esc(keyLabel(ch))}</kbd></span><span><b>${esc(FINGERS[i.f].n)}</b> <span class="muted">${esc(rowName)}${sh}</span></span></li>`;
    }).join('');
    // exemples de mots
    const c = ctxForLesson(lesson, id);
    let pool = wordPool(c, { must: c.newPlain.length ? c.newPlain : (c.newKeys.length ? c.newKeys : []) });
    if (pool.length < 6) pool = wordPool(c);
    const examples = shuffle(pool.filter(w => w.length >= 2)).slice(0, 14);
    const exHTML = examples.length
      ? `<ul class="word-chips">${examples.map(w => `<li>${esc(w)}</li>`).join('')}</ul>`
      : '<p class="muted">Pas encore de vrais mots avec ces touches : les premiers exercices utilisent des séries de lettres.</p>';

    const stageRows = stages.map(s => {
      const r = stageRec(lesson.id, s.i);
      return `<li class="stage${r && r.stars ? ' done' : ''}">
        <span class="sg-n">${s.i + 1}</span>
        <span class="sg-main"><b>${esc(s.name)}</b><span class="muted">${esc(s.d || '')}</span></span>
        <span class="sg-meta">${r ? `${starsHTML(r.stars)}<span class="small muted">${r.acc} % · ${r.wpm} mpm</span>` : `<span class="small muted">objectif : ${s.goalAcc} %</span>`}</span>
        <button class="btn sm ${r && r.stars ? '' : 'primary'}" type="button" data-run="lesson:${lesson.id}:${s.i}">${r ? 'Refaire' : 'Lancer'}</button>
      </li>`;
    }).join('');

    return `
    <nav class="crumbs" aria-label="Fil d'Ariane"><button class="link" type="button" data-go="cours">Parcours</button><span>›</span><span>${esc(mod ? mod.title : '')}</span></nav>
    <header class="lesson-head">
      <p class="kicker">Leçon ${idx + 1} sur ${ls.length}</p>
      <h1>${esc(lessonTitle(lesson, id))}</h1>
      ${keys ? `<div class="lh-keys">${keycapsHTML(keys.length > 14 ? keys.slice(0, 14) : keys, id)}</div>` : ''}
    </header>

    <div class="lesson-grid">
      <div class="lesson-text">
        <section class="block"><h2>Ce qu'on apprend</h2><p>${body('intro')}</p></section>
        <section class="block"><h2>Le geste</h2><p>${body('gesture')}</p></section>
        <section class="block warn"><h2>L'erreur à éviter</h2><p>${body('mistake')}</p></section>
        ${lesson.tip ? `<section class="block tip"><h2>Un conseil</h2><p>${body('tip')}</p></section>` : ''}
        ${fingerRows ? `<section class="block"><h2>Doigt par doigt</h2><ul class="finger-list">${fingerRows}</ul></section>` : ''}
        <section class="block"><h2>Des mots pour te faire une idée</h2>${exHTML}</section>
      </div>
      <aside class="lesson-side">
        <div class="panel kb-wrap" id="kbLesson">${kbHTML(id)}<p class="small muted">${keys ? 'Les touches en couleur sont les nouvelles.' : 'Toutes les touches déjà vues sont utilisées.'}</p></div>
        <div class="panel">
          <div class="panel-head"><h2>Les exercices</h2><span class="small muted">${st.done} / ${st.total}</span></div>
          <ol class="stages">${stageRows}</ol>
          <p class="small muted">Un exercice est validé à partir de ${settings().passAcc} % de précision. Le texte est différent à chaque essai.</p>
        </div>
      </aside>
    </div>

    <div class="pager">
      ${prev ? `<button class="btn ghost" type="button" data-go="lecon:${prev.id}">← ${esc(lessonTitle(prev, id))}</button>` : '<span></span>'}
      ${nxt ? `<button class="btn ghost" type="button" data-go="lecon:${nxt.id}">${esc(lessonTitle(nxt, id))} →</button>` : '<span></span>'}
    </div>`;
  },
  mount(root, param) {
    const id = layoutId();
    const lesson = lessonsFor(id).find(l => l.id === param) || lessonsFor(id)[0];
    const kb = Keyboard($('#kbLesson .kb', root));
    kb.setFocus(keysOf(lesson, id));
  },
};

function startRun(cfg) { App.run = cfg; go('run'); }

function resultHTML(res, o = {}) {
  const missList = Object.entries(res.miss || {}).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const verdict = o.verdict || '';
  return `
  <div class="result" role="region" aria-label="Résultat">
    <div class="result-head">
      <p class="kicker">${esc(o.kicker || 'Résultat')}</p>
      <h2>${esc(o.title || 'Exercice terminé')}</h2>
      ${o.stars != null ? starsHTML(o.stars) : ''}
      ${verdict ? `<p class="verdict ${o.pass ? 'ok' : 'ko'}">${verdict}</p>` : ''}
    </div>
    <div class="grid g4 big-stats">
      <div class="panel"><span class="bs-v">${res.wpm}</span><span class="bs-l">mots / min</span>${o.level ? `<span class="small muted">${esc(o.level)}</span>` : ''}</div>
      <div class="panel"><span class="bs-v">${res.acc % 1 === 0 ? res.acc : res.acc.toFixed(1)}<small>%</small></span><span class="bs-l">précision</span>${o.goal ? `<span class="small muted">objectif ${o.goal} %</span>` : ''}</div>
      <div class="panel"><span class="bs-v">${fmtTime(res.secs)}</span><span class="bs-l">durée</span><span class="small muted">${res.hits} caractères</span></div>
      <div class="panel"><span class="bs-v">${res.errs}</span><span class="bs-l">erreur${res.errs > 1 ? 's' : ''}</span></div>
    </div>
    ${missList.length ? `<div class="panel"><h3>Touches à travailler</h3><div class="miss-list">${missList.map(([ch, n]) => `<span class="miss">${keycapsHTML(ch)}<b>${n}</b></span>`).join('')}</div></div>` : '<p class="muted">Aucune erreur sur cette série.</p>'}
    ${o.extra || ''}
    <div class="cta result-actions">${o.actions || ''}</div>
    <p class="small muted">Entrée : ${esc(o.enterLabel || 'continuer')} · Tab : refaire</p>
  </div>`;
}

PAGES.run = {
  html() { return '<div id="runRoot"></div>'; },
  mount(root) {
    const r = App.run;
    const rootEl = $('#runRoot', root);
    if (!r) { go('home'); return; }
    const id = layoutId();
    let ctl = null, off = null;
    const clearEnter = () => { if (off) { off(); off = null; } };
    App.cleanup = () => { clearEnter(); if (ctl) ctl.destroy(); };
    // Entrée = action principale, Tab = refaire, depuis le clavier
    const bindEnter = (fn, again) => {
      clearEnter();
      const t0 = performance.now();
      const h = e => {
        if ((e.key !== 'Enter' && e.key !== 'Tab') || performance.now() - t0 < 700) return;
        e.preventDefault();
        if (e.repeat) return;
        const f = e.key === 'Tab' ? (again || fn) : fn;
        clearEnter(); f();
      };
      window.addEventListener('keydown', h, true);
      off = () => window.removeEventListener('keydown', h, true);
    };

    /* ---- Leçon ---- */
    if (r.kind === 'lesson') {
      const ls = lessonsFor(id);
      const lesson = ls.find(l => l.id === r.lessonId);
      if (!lesson) { go('cours'); return; }
      const stages = stagesOf(lesson, id);
      const stage = stages[r.stage];
      const keys = keysOf(lesson, id);
      const launch = () => {
        clearEnter(); if (ctl) ctl.destroy();
        ctl = mountSession(rootEl, {
          kicker: `Leçon ${ls.indexOf(lesson) + 1} · exercice ${r.stage + 1} sur ${stages.length}`,
          title: stage.name, sub: stage.d,
          text: genStage(stage, lesson, id),
          focusKeys: keys,
          layoutId: id,
          onRestart: launch,
          onExit: () => go('lecon', lesson.id),
          onFinish: res => {
            const pass = res.acc >= stage.goalAcc;
            const stars = starsFor(res.acc, stage.goalAcc);
            const rec = Store.d.lessons[lesson.id] || (Store.d.lessons[lesson.id] = { stages: {} });
            const prev = rec.stages[stage.i];
            if (stars > 0 && (!prev || stars > prev.stars || (stars === prev.stars && res.acc > prev.acc))) rec.stages[stage.i] = { stars, acc: res.acc, wpm: res.wpm };
            logSession({ t: Date.now(), mode: 'lesson', ref: lesson.id + ':' + stage.i, wpm: res.wpm, acc: res.acc, secs: res.secs, chars: res.hits, errs: res.errs });
            const lastStage = stage.i >= stages.length - 1;
            const nextL = ls[ls.indexOf(lesson) + 1];
            let actions = '', enterFn, enterLabel;
            if (pass && !lastStage) {
              actions = `<button class="btn primary lg" type="button" id="aNext">Exercice suivant</button>`;
              enterFn = () => startRun({ kind: 'lesson', lessonId: lesson.id, stage: stage.i + 1 }); enterLabel = 'exercice suivant';
            } else if (pass && lastStage) {
              actions = nextL ? `<button class="btn primary lg" type="button" id="aNext">Leçon suivante : ${esc(lessonTitle(nextL, id))}</button>` : `<button class="btn primary lg" type="button" id="aNext">Retour au parcours</button>`;
              enterFn = () => nextL ? go('lecon', nextL.id) : go('cours'); enterLabel = nextL ? 'leçon suivante' : 'retour au parcours';
            } else {
              actions = `<button class="btn primary lg" type="button" id="aNext">Réessayer</button>`;
              enterFn = launch; enterLabel = 'réessayer';
            }
            actions += ` <button class="btn" type="button" id="aAgain">${pass ? 'Refaire' : 'Un autre texte'}</button> <button class="btn ghost" type="button" id="aBack">Retour à la leçon</button>`;
            const verdict = pass
              ? (stars === 3 ? 'Parfait. Ce geste est installé.' : 'Validé. Continue, la vitesse viendra.')
              : `Précision de ${res.acc} % : l'objectif est ${stage.goalAcc} %. Ralentis, regarde la touche à venir sur le clavier, et recommence.`;
            rootEl.innerHTML = resultHTML(res, {
              kicker: `Leçon ${ls.indexOf(lesson) + 1} · ${stage.name}`, title: pass ? 'Exercice validé' : 'Pas encore validé',
              stars, pass, verdict, goal: stage.goalAcc, actions, enterLabel,
            });
            $('#aNext', rootEl).addEventListener('click', enterFn);
            $('#aAgain', rootEl).addEventListener('click', launch);
            $('#aBack', rootEl).addEventListener('click', () => go('lecon', lesson.id));
            bindEnter(enterFn, launch);
          },
        });
      };
      launch();
      return;
    }

    /* ---- Entraînement libre / test ---- */
    const launchFree = () => {
      clearEnter(); if (ctl) ctl.destroy();
      const text = r.make();
      ctl = mountSession(rootEl, {
        kicker: r.kicker, title: r.title, sub: r.sub, text,
        timeLimit: r.timeLimit || null,
        extend: r.timeLimit ? () => r.more() : null,
        rhythm: r.rhythm || null,
        focusKeys: r.focusKeys || '',
        layoutId: id,
        onRestart: launchFree,
        onExit: () => go(r.back || 'pratique'),
        onFinish: res => {
          const prevRank = r.kind === 'test' ? currentRank() : null;
          logSession({ t: Date.now(), mode: r.kind, ref: r.ref || '', wpm: res.wpm, acc: res.acc, secs: res.secs, chars: res.hits, errs: res.errs });
          const base = Store.d.baseline;
          let extra = '', levelName = '';
          if (r.kind === 'test') {
            const first = Store.d.history.filter(h => h.mode === 'test').length === 1;
            const rk = rankFor(res.wpm, res.acc), idx = rankIndex(res.wpm, res.acc);
            levelName = rk.name;
            const counted = res.secs >= 25;
            let line = first ? 'C\'est ton point de départ. Refais ce test dans une semaine pour mesurer tes progrès.'
              : (base ? 'Départ : ' + base.wpm + ' mpm. Record : ' + Store.d.best.test + ' mpm.' : '');
            if (counted && prevRank && idx > prevRank.idx) line = 'Nouveau rang ! Tu étais ' + prevRank.r.name + '. ' + line;
            if (!counted) line = 'Test trop court pour compter dans ton rang (25 secondes minimum). ' + line;
            extra = `<div class="panel level-box">${medalHTML(rk)}<div><span class="kicker">Rang de ce test</span><b>${esc(rk.name)}</b><p class="muted">${esc(line)}</p><p class="small muted">${esc(nextRankHint(res.wpm, res.acc, idx))}</p></div></div>`;
          }
          const actions = `<button class="btn primary lg" type="button" id="aNext">Rejouer</button> <button class="btn" type="button" id="aBack">Changer de réglage</button> <button class="btn ghost" type="button" id="aStats">Mes statistiques</button>`;
          rootEl.innerHTML = resultHTML(res, { kicker: r.kicker, title: 'Terminé', level: levelName, extra, actions, enterLabel: 'rejouer' });
          $('#aNext', rootEl).addEventListener('click', launchFree);
          $('#aBack', rootEl).addEventListener('click', () => go(r.back || 'pratique'));
          $('#aStats', rootEl).addEventListener('click', () => go('stats'));
          bindEnter(launchFree);
        },
      });
    };
    launchFree();
  },
};

/* ===== 06-app.js ===== */
/* ============================================================
   Version installable (« app ») : installation sur l'écran d'accueil,
   fonctionnement hors ligne, stockage durable. Sans effet dans l'artefact
   claude.ai ni dans le fichier ouvert en local.
   ============================================================ */
'use strict';

/** Cible de compilation, injectée par build.js : 'app', 'artifact' ou 'file'. */
const APP_TARGET = typeof BUILD_TARGET !== 'undefined' ? BUILD_TARGET : 'file';
const AppInstall = { prompt: null, installed: false };

const isStandalone = () => {
  try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; }
};
/** iPhone, iPad (qui se présente comme un Mac tactile) ou Mac avec Safari : l'installation passe par un menu. */
function appleKind() {
  const ua = navigator.userAgent || '';
  if (/iPhone|iPod/.test(ua)) return 'iphone';
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'ipad';
  if (/Macintosh/.test(ua) && /Safari\//.test(ua) && !/Chrome|Chromium|Edg|Firefox|OPR/.test(ua)) return 'mac-safari';
  return null;
}

function initApp() {
  if (APP_TARGET !== 'app') return;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    AppInstall.prompt = e;
    if (App.page === 'home') render();
  });
  window.addEventListener('appinstalled', () => {
    AppInstall.installed = true; AppInstall.prompt = null;
    if (App.page === 'home') render();
  });
  const local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || local)) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* hors ligne indisponible : le site marche quand même */ });
  }
  // demande au navigateur de ne pas effacer la progression quand l'espace manque
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignoré */ }
}

/** Encart d'installation de l'accueil, une fois le clavier reconnu. */
function installCardHTML() {
  if (APP_TARGET !== 'app' || isStandalone() || AppInstall.installed || settings().installHidden || !settings().kbChecked) return '';
  const kind = appleKind();
  let how, btn = '';
  if (AppInstall.prompt) {
    how = 'Installe Dix Doigts comme une application : une icône sur ton écran, une fenêtre à part, et ça marche même sans internet.';
    btn = '<button class="btn primary" type="button" id="instGo">Installer l\'application</button>';
  } else if (kind === 'iphone' || kind === 'ipad') {
    how = `Pour l'avoir comme une application sur ton ${kind === 'ipad' ? 'iPad' : 'iPhone'} : dans Safari, touche le bouton Partager (le carré avec une flèche vers le haut), puis « Sur l'écran d'accueil ». Elle marchera ensuite même sans internet.`;
  } else if (kind === 'mac-safari') {
    how = 'Pour l\'avoir comme une application sur ton Mac : dans Safari, menu Fichier, puis « Ajouter au Dock ». Elle marchera ensuite même sans internet.';
  } else {
    how = 'Pour l\'avoir comme une application, ouvre cette page dans Chrome ou Edge et choisis « Installer » dans le menu (ou l\'icône à droite de la barre d\'adresse). Elle marche aussi sans internet une fois ouverte.';
  }
  return `<section class="panel install-card" aria-labelledby="h-inst">
    <h2 id="h-inst">Installer l'application</h2>
    <p>${esc(how)}</p>
    <div class="cta">${btn}<button class="btn ghost" type="button" id="instHide">Ne plus afficher</button></div>
  </section>`;
}
function bindInstall(root) {
  const goBtn = $('#instGo', root), hide = $('#instHide', root);
  if (goBtn) goBtn.addEventListener('click', async () => {
    const p = AppInstall.prompt;
    if (!p) return;
    AppInstall.prompt = null;
    try {
      p.prompt();
      const r = await p.userChoice;
      if (r && r.outcome === 'accepted') AppInstall.installed = true;
    } catch (e) { /* ignoré */ }
    render();
  });
  if (hide) hide.addEventListener('click', () => { settings().installHidden = true; Store.save(); render(); });
}

/** Sur un écran tactile sans clavier : les exercices marchent, mais la méthode demande un vrai clavier. */
function touchNoteHTML() {
  if (!isTouchOnly()) return '';
  return '<div class="note touch-note">Ici, les exercices se font avec le clavier de l\'écran : touche le texte pour le faire apparaître. Mais la méthode des dix doigts demande un vrai clavier : sur une tablette, branche un clavier USB ou Bluetooth pour en profiter vraiment.</div>';
}

   Pages : entraînement libre, test, jeu, statistiques, réglages

'use strict';

/* ---------- Graphique en ligne (SVG, couleurs via classes) ---------- */
function lineChart(vals, o = {}) {
  const W = 640, H = 210, pl = 44, pr = 14, pt = 16, pb = 30;
  if (vals.length < 2) return '<p class="muted small">Il faut au moins deux séances pour tracer une courbe.</p>';
  const min = o.min != null ? o.min : 0;
  let max = o.max != null ? o.max : Math.max(10, ...vals);
  if (o.max == null) max = Math.ceil(max * 1.1 / 10) * 10;
  const x = i => pl + (W - pl - pr) * (i / (vals.length - 1));
  const y = v => pt + (H - pt - pb) * (1 - (v - min) / (max - min));
  const ticks = 4;
  let g = '';
  for (let t = 0; t <= ticks; t++) {
    const v = min + (max - min) * t / ticks;
    g += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="ax" x="${pl - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${Math.round(v)}</text>`;
  }
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area = `${x(0).toFixed(1)},${y(min).toFixed(1)} ${pts} ${x(vals.length - 1).toFixed(1)},${y(min).toFixed(1)}`;
  const dots = vals.length <= 40 ? vals.map((v, i) => `<circle class="dt" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3"/>`).join('') : '';
  const lastV = vals[vals.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'Courbe')}">
    ${g}
    <polygon class="ar" points="${area}"/>
    <polyline class="ln" points="${pts}"/>
    ${dots}
    <circle class="dt end" cx="${x(vals.length - 1).toFixed(1)}" cy="${y(lastV).toFixed(1)}" r="5"/>
    <text class="ax end-l" x="${x(vals.length - 1).toFixed(1)}" y="${(y(lastV) - 11).toFixed(1)}" text-anchor="end">${Math.round(lastV * 10) / 10}${o.unit || ''}</text>
    <text class="ax" x="${pl}" y="${H - 8}">séance 1</text>
    <text class="ax" x="${W - pr}" y="${H - 8}" text-anchor="end">séance ${vals.length}</text>
  </svg>`;
}

const PRACT_TYPES = [
  ['words', 'Mots', 'Des mots français courants'],
  ['sentences', 'Phrases', 'De vraies phrases, avec la ponctuation apprise'],
  ['text', 'Textes', 'Un paragraphe entier'],
  ['pseudo', 'Syllabes', 'Des combinaisons sans sens pour automatiser le geste'],
  ['pat', 'Touches choisies', 'Seulement les touches que tu as sélectionnées'],
  ['shortWords', 'Mots courts', 'De deux à cinq lettres'],
  ['longWords', 'Mots longs', 'Sept lettres et plus'],
  ['altWords', 'Alternance des mains', 'Gauche, droite, gauche…'],
  ['sameFingerWords', 'Même doigt', 'Le point dur : le même doigt deux fois de suite'],
  ['bigrams', 'Bigrammes', 'es, en, re, er, on, nt…'],
  ['digNums', 'Chiffres', 'Des nombres, avec les chiffres appris'],
  ['puncts', 'Ponctuation', '? ! : ; - dans de courtes phrases'],
  ['accWords', 'Accents', 'é è à ç ù ê â î ô û'],
  ['weak', 'Mes touches faibles', 'Des mots qui contiennent tes touches les plus ratées'],
];
const PR = { type: 'words', scope: 'all', lesson: 0, custom: '', len: 100, rhythm: false, cpm: 150 };
const LEN_OPTS = [[40, 'Court'], [100, 'Moyen'], [220, 'Long'], [400, 'Très long']];

function practiceCtx(id) {
  let c;
  if (PR.scope === 'all') c = ctxAll(id);
  else if (PR.scope === 'lesson') {
    const ls = lessonsFor(id);
    const idx = clamp(PR.lesson, 0, ls.length - 1);
    c = makeCtx(id, learnedAt(id, idx), keysOf(ls[idx], id));
  } else {
    const set = new Set([' ']);
    [...PR.custom].forEach(ch => set.add(ch));
    c = makeCtx(id, { set, caps: false }, PR.custom);
  }
  return c;
}
function practiceText(n) {
  const id = layoutId();
  let c = practiceCtx(id);
  if (PR.type === 'weak') {
    const w = weakKeys(id, 6, 5).map(r => r.k);
    if (!w.length) return null;
    c = ctxAll(id); c.newKeys = w; c.newPlain = w.filter(k => /[a-z]/.test(k));
  }
  if (PR.type === 'pat' && !c.newKeys.length) return null;
  if (PR.type === 'digNums' && !c.digits.length) return null;
  if (PR.type === 'accWords' && !isAz(id)) return null;
  const o = PR.type === 'digNums' ? { all: true } : {};
  const t = normalizeText((GEN[PR.type] || GEN.words)(c, n, o));
  return t || null;
}

          : PR.type === 'pat' ? 'Choisis des touches ou une leçon : cet exercice travaille seulement les nouvelles touches.'
          : PR.type === 'digNums' ? 'Les chiffres ne sont pas inclus dans cette sélection. Choisis « Tout le clavier » ou une leçon plus avancée.'
          : 'Cette combinaison ne donne aucun texte. Essaie avec plus de touches.';
        note.hidden = false; return;
      }
      const label = PRACT_TYPES.find(t => t[0] === PR.type)[1];
      startRun({
        kind: 'practice', back: 'pratique', kicker: 'Entraînement libre', title: label, sub: PR.scope === 'all' ? 'Tout le clavier' : PR.scope === 'lesson' ? 'Jusqu\'à la leçon ' + (PR.lesson + 1) : 'Touches choisies',
        ref: PR.type, make: () => practiceText(PR.len) || t, rhythm: PR.rhythm ? PR.cpm : null,
        focusKeys: PR.scope === 'custom' ? PR.custom : '',
      });
    });
  },
};

const GAME = { scope: -1, speed: 'normal' };
const SPEEDS = { calme: 0.75, normal: 1, rapide: 1.35 };

PAGES.jeu = {
  html() {
    const id = layoutId();
    const ls = lessonsFor(id);
    const opts = ['<option value="-1">Toutes les touches</option>'].concat(ls.map((l, i) => `<option value="${i}"${GAME.scope === i ? ' selected' : ''}>Jusqu'à la leçon ${i + 1}</option>`)).join('');
    return `
    <header class="page-head">
      <p class="kicker">Jeu</p>
      <h1>Pluie de mots</h1>
      <p class="lead">Des mots tombent du haut de l'écran. Tape-les avant qu'ils touchent le sol. Cinq vies, une difficulté qui monte. Utile pour gagner en réflexe sans penser à la méthode.</p>
    </header>
    <div id="gameRoot">
      <div class="panel game-setup">
        <label class="field" for="gscope"><span>Touches utilisées</span><select id="gscope">${opts}</select></label>
        <div class="field"><span>Vitesse</span>
          <div class="chips">${Object.keys(SPEEDS).map(k => `<label class="chip-radio"><input type="radio" name="gspeed" value="${k}"${GAME.speed === k ? ' checked' : ''}><span>${k[0].toUpperCase() + k.slice(1)}</span></label>`).join('')}</div>
        </div>
        <div class="cta"><button class="btn primary lg" type="button" id="ggo">Jouer</button></div>
        ${Store.d.best.game ? `<p class="small muted">Meilleur score : ${Store.d.best.game}</p>` : ''}
      </div>
    </div>`;
  },
  mount(root) {
    $('#gscope', root).addEventListener('change', e => { GAME.scope = +e.target.value; });
    $$('input[name="gspeed"]', root).forEach(i => i.addEventListener('change', () => { GAME.speed = i.value; }));
    $('#ggo', root).addEventListener('click', () => startGame($('#gameRoot', root)));
  },

function startGame(host) {
  const id = layoutId();
  const ls = lessonsFor(id);
  const learned = GAME.scope < 0 ? ctxAll(id).learned : learnedAt(id, clamp(GAME.scope, 0, ls.length - 1));
  const c = makeCtx(id, learned, []);
  let pool = wordPool(c, { min: 2, max: 10 }).filter(w => /^[a-zàâçéèêîôùû]+$/.test(w));
  if (pool.length < 14) { const extra = []; for (let i = 0; i < 30; i++) extra.push(pseudoWord(c, [], 3, 6)); pool = pool.concat(extra); }
  const mul = SPEEDS[GAME.speed] || 1;

  host.innerHTML = `
    <div class="game">
      <div class="hud game-hud">
        <div class="hud-i"><span class="v" data-g="score">0</span><span class="l">score</span></div>
        <div class="hud-i"><span class="v" data-g="lives">●●●●●</span><span class="l">vies</span></div>
        <div class="hud-i"><span class="v" data-g="level">1</span><span class="l">niveau</span></div>
        <div class="hud-i"><span class="v" data-g="combo">0</span><span class="l">série</span></div>
        <button class="btn ghost sm" type="button" data-g="quit">Quitter <kbd>Échap</kbd></button>
      </div>
      <div class="arena" data-g="arena"><div class="floor"></div></div>
      <div class="typed" data-g="buf" aria-live="off">Tape les mots qui tombent.</div>
    </div>`;
  const g = k => $(`[data-g="${k}"]`, host);
  const arena = g('arena');
  let words = [], target = null, buf = '', lives = 5, score = 0, level = 1, killed = 0, combo = 0, good = 0, bad = 0, charsOk = 0;
  let last = performance.now(), spawnIn = 600, raf = 0, over = false;
  const t0 = performance.now();

  function hudUpdate() {
    g('score').textContent = score;
    g('lives').textContent = '●'.repeat(Math.max(0, lives)) + '○'.repeat(Math.max(0, 5 - lives));
    g('level').textContent = level;
    g('combo').textContent = combo;
    g('buf').textContent = buf || (isTouchOnly() ? 'Tape les mots qui tombent. Touche la zone de jeu si le clavier disparaît.' : 'Tape les mots qui tombent.');
  }
  function spawn() {
    const maxLen = Math.min(10, 3 + Math.floor(level / 2) + 1);
    const cands = pool.filter(w => w.length <= maxLen);
    const text = pick(cands.length ? cands : pool);
    const el = document.createElement('span');
    el.className = 'fw';
    el.innerHTML = `<i></i><b>${esc(text)}</b>`;
    arena.appendChild(el);
    const W = arena.clientWidth, w = el.offsetWidth;
    let x = 6 + rnd(Math.max(1, W - w - 12)), tries = 0;
    while (tries++ < 6 && words.some(o => o.y < 70 && Math.abs(o.x - x) < Math.max(o.w, w) + 8)) x = 6 + rnd(Math.max(1, W - w - 12));
    words.push({ text, el, x, y: -34, w, v: (30 + level * 6) * mul + rnd(8) });
  }
  function drop(w, cls) {
    words = words.filter(o => o !== w);
    w.el.classList.add(cls);
    setTimeout(() => w.el.remove(), 260);
    if (target === w) { target = null; buf = ''; }
  }
  function frame(now) {
    if (over) return;
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    const H = arena.clientHeight;
    spawnIn -= dt * 1000;
    if (spawnIn <= 0) { spawn(); spawnIn = Math.max(750, (2500 - level * 170) / mul); }
    for (const w of words.slice()) {
      w.y += w.v * dt;
      w.el.style.transform = `translate(${w.x}px, ${w.y}px)`;
      if (w.y > H - 36) { lives--; combo = 0; drop(w, 'lost'); hudUpdate(); if (lives <= 0) { end(); return; } }
    }
    raf = requestAnimationFrame(frame);
  }
  function paintTarget() {
    words.forEach(w => {
      const done = w === target ? buf.length : 0;
      w.el.classList.toggle('target', w === target);
      const i = w.el.firstChild; i.textContent = w.text.slice(0, done);
      w.el.lastChild.textContent = w.text.slice(done);
    });
  }
  let lastKey = null;
  function onKey(e) {
    if (over) return;
    if (e.key === 'Escape') { e.preventDefault(); quit(); return; }
    if ((e.ctrlKey || e.metaKey) && !(e.getModifierState && e.getModifierState('AltGraph'))) return;
    if (e.key.length !== 1) { if (e.key === 'Dead') e.preventDefault(); return; }
    e.preventDefault();
    lastKey = { ch: e.key, t: performance.now() };
    typeChar(e.key);
  }
  function typeChar(key) {
    const ch = key.toLowerCase();
    if (ch === ' ') return;
    let ok = false;
    if (target && target.text[buf.length] === ch) { buf += ch; ok = true; }
    else {
      const c2 = words.filter(w => w.text[0] === ch).sort((a, b) => b.y - a.y)[0];
      if (c2) { target = c2; buf = ch; ok = true; }
    }
    if (ok) {
      good++; charsOk++; Sound.ok();
      if (target && buf === target.text) {
        score += target.text.length * 10 * (1 + Math.floor(combo / 5));
        combo++; killed++;
        drop(target, 'hit');
        if (killed % 8 === 0) level++;
      }
    } else {
      bad++; combo = 0; Sound.err();
      arena.classList.remove('shake'); void arena.offsetWidth; arena.classList.add('shake');
    }
    paintTarget(); hudUpdate();
  }
  function cleanup() { over = true; cancelAnimationFrame(raf); window.removeEventListener('keydown', onKey, true); soft.blur(); }
  function quit() { cleanup(); go('jeu'); }
  function end() {
    cleanup();
    const secs = (performance.now() - t0) / 1000;
    const acc = good + bad ? Math.round(1000 * good / (good + bad)) / 10 : 100;
    const wpm = Math.round((charsOk / 5) / (secs / 60));
    const best = Store.d.best.game || 0;
    const record = score > best;
    if (record) Store.d.best.game = score;
    logSession({ t: Date.now(), mode: 'game', ref: GAME.speed, wpm, acc, secs, chars: charsOk, errs: bad });
    Sound.done();
    host.innerHTML = `
      <div class="result">
        <div class="result-head"><p class="kicker">Pluie de mots</p><h2>${record ? 'Nouveau record !' : 'Partie terminée'}</h2></div>
        <div class="grid g4 big-stats">
          <div class="panel"><span class="bs-v">${score}</span><span class="bs-l">score</span>${best && !record ? `<span class="small muted">record : ${best}</span>` : ''}</div>
          <div class="panel"><span class="bs-v">${killed}</span><span class="bs-l">mots tapés</span></div>
          <div class="panel"><span class="bs-v">${level}</span><span class="bs-l">niveau atteint</span></div>
          <div class="panel"><span class="bs-v">${acc % 1 === 0 ? acc : acc.toFixed(1)}<small>%</small></span><span class="bs-l">précision</span></div>
        </div>
        <div class="cta result-actions"><button class="btn primary lg" type="button" id="gAgain">Rejouer <kbd>Entrée</kbd></button> <button class="btn ghost" type="button" id="gBack">Changer de réglage</button></div>
      </div>`;
    $('#gAgain', host).addEventListener('click', () => startGame(host));
    $('#gBack', host).addEventListener('click', () => go('jeu'));
    // Entrée ou Tab : rejouer sans la souris
    const tEnd = performance.now();
    const hk = e => {
      if ((e.key !== 'Enter' && e.key !== 'Tab') || e.repeat || performance.now() - tEnd < 700) return;
      e.preventDefault();
      window.removeEventListener('keydown', hk, true);
      startGame(host);
    };
    window.addEventListener('keydown', hk, true);
    App.cleanup = () => window.removeEventListener('keydown', hk, true);
  }
  $('[data-g="quit"]', host).addEventListener('click', quit);
  // clavier de l'écran (téléphone, tablette sans clavier)
  const soft = softInput(arena, ch => {
    if (over) return;
    if (lastKey && lastKey.ch === ch && performance.now() - lastKey.t < 150) { lastKey = null; return; }
    typeChar(ch);
  });
  arena.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') soft.focus(); });
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (isTouchOnly()) soft.focus();
  window.addEventListener('keydown', onKey, true);
  App.cleanup = cleanup;
  hudUpdate();
  raf = requestAnimationFrame(t => { last = t; frame(t); });
}

const STAT = { heat: 'err' };
PAGES.stats = {
  html() {
    const id = layoutId();
    const d = Store.d;
    const hist = d.history.filter(h => h.secs >= 4);
    const totalSecs = Object.values(d.days).reduce((a, b) => a + b, 0);
    const last10 = hist.slice(-10);
    const avgAcc = last10.length ? Math.round(10 * last10.reduce((a, h) => a + h.acc, 0) / last10.length) / 10 : null;
    const wk = weakKeys(id, 6, 5);
    // activité sur 14 jours
    const days = [];
    const dd = new Date();
    for (let i = 13; i >= 0; i--) {
      const x = new Date(dd.getFullYear(), dd.getMonth(), dd.getDate() - i);
      const k = x.getFullYear() + '-' + pad2(x.getMonth() + 1) + '-' + pad2(x.getDate());
      days.push({ k, s: d.days[k] || 0, lab: x.toLocaleDateString('fr-FR', { weekday: 'narrow' }) });
    }
    const maxS = Math.max(60, ...days.map(x => x.s));
    // par doigt
    const km = statsOf(id);
    const L = LAYOUTS[id];
    const perF = {};
    FINGER_ORDER.concat(['th']).forEach(f => perF[f] = { h: 0, m: 0, t: 0, n: 0 });
    Object.entries(km).forEach(([k, r]) => { const i = L.map.get(k); if (!i) return; const p = perF[i.f]; p.h += r.h; p.m += r.m; p.t += r.t; p.n += r.n; });
    const fingerRows = FINGER_ORDER.concat(['th']).map(f => {
      const p = perF[f]; const seen = p.h + p.m;
      const acc = seen ? Math.round(1000 * p.h / seen) / 10 : null;
      const ms = p.n ? Math.round(p.t / p.n) : null;
      return `<tr><td><span class="sw-inline f-${f}"></span>${esc(FINGERS[f].n)}</td><td>${seen || '–'}</td><td>${acc != null ? acc + ' %' : '–'}</td><td>${ms != null ? ms + ' ms' : '–'}</td></tr>`;
    }).join('');
    const lessonsDone = courseProgress(id);
    const recent = hist.slice(-10).reverse().map(h => {
      const lab = h.mode === 'lesson' ? 'Leçon' : h.mode === 'test' ? 'Test' : h.mode === 'game' ? 'Jeu' : 'Libre';
      return `<tr><td>${new Date(h.t).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</td><td>${lab}</td><td>${h.wpm} mpm</td><td>${h.acc} %</td><td>${fmtDur(h.secs)}</td></tr>`;
    }).join('');
    return `
    <header class="page-head">
      <p class="kicker">Statistiques</p>
      <h1>Tes progrès</h1>
      <p class="lead">Tout est calculé à partir de tes séances et enregistré automatiquement.</p>

      <h2>Ton niveau</h2>
      ${levelPanelHTML()}
    </section>
    <div class="grid g4 stat-tiles">
      <div class="panel"><span class="bs-v">${hist.length}</span><span class="bs-l">séances</span></div>
      <div class="panel"><span class="bs-v">${fmtDur(totalSecs)}</span><span class="bs-l">temps d'entraînement</span></div>
      <div class="panel"><span class="bs-v">${d.best.test || '–'}</span><span class="bs-l">record au test (mpm)</span></div>
      <div class="panel"><span class="bs-v">${avgAcc != null ? avgAcc + '<small>%</small>' : '–'}</span><span class="bs-l">précision récente</span></div>
    </div>
    <section class="band">
      <h2>Vitesse et précision</h2>
      <div class="grid g2">
        <div class="panel"><h3>Mots par minute</h3>${lineChart(hist.slice(-40).map(h => h.wpm), { label: 'Vitesse par séance', unit: ' mpm' })}</div>
        <div class="panel"><h3>Précision</h3>${lineChart(hist.slice(-40).map(h => h.acc), { label: 'Précision par séance', unit: ' %', min: 50, max: 100 })}</div>
      </div>
    </section>
    <section class="band">
      <h2>Ton clavier</h2>
      <div class="panel">
        <div class="seg" role="group" aria-label="Type de carte">
          <button type="button" class="${STAT.heat === 'err' ? 'on' : ''}" data-heat="err">Erreurs</button>
          <button type="button" class="${STAT.heat === 'slow' ? 'on' : ''}" data-heat="slow">Lenteur</button>
        </div>
        <div class="kb-wrap" id="kbHeat">${kbHTML(id)}</div>
        <p class="small muted" id="heatLegend"></p>
      </div>
      <div class="grid g2">
        <div class="panel">
          <h3>Touches à travailler</h3>
          ${wk.length ? `<div class="weak-list">${wk.map(r => `<div class="weak">${keycapsHTML(r.k)}<span>${Math.round(100 * r.err)} % d'erreurs</span><span class="muted">${r.ms ? Math.round(r.ms) + ' ms' : ''}</span></div>`).join('')}</div>
          <div class="cta"><button class="btn primary" type="button" id="goWeak">Exercice sur ces touches</button></div>` : '<p class="muted">Pas assez de données. Fais quelques exercices et tes touches faibles apparaîtront ici.</p>'}
        </div>
        <div class="panel">
          <h3>Doigt par doigt</h3>
          <div class="tbl-wrap"><table class="tbl dense"><thead><tr><th>Doigt</th><th>Frappes</th><th>Précision</th><th>Temps moyen</th></tr></thead><tbody>${fingerRows}</tbody></table></div>
        </div>
      </div>
    </section>
    <section class="band">
      <h2>Régularité</h2>
      <div class="panel">
        <div class="days" role="img" aria-label="Minutes par jour sur les 14 derniers jours">
          ${days.map(x => `<div class="day"><div class="bar"><i style="height:${Math.round(100 * x.s / maxS)}%"></i></div><span>${esc(x.lab)}</span><b>${x.s ? Math.max(1, Math.round(x.s / 60)) : ''}</b></div>`).join('')}
        </div>
        <p class="small muted">Minutes par jour sur les 14 derniers jours. Série en cours : ${streakDays()} jour${streakDays() > 1 ? 's' : ''}. Leçons terminées : ${lessonsDone.done} sur ${lessonsDone.total}.</p>
      </div>
    </section>
    ${recent ? `<section class="band"><h2>Dernières séances</h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Quand</th><th>Type</th><th>Vitesse</th><th>Précision</th><th>Durée</th></tr></thead><tbody>${recent}</tbody></table></div></section>` : ''}`;
  },
  mount(root) {
    const id = layoutId();
    const kb = Keyboard($('#kbHeat .kb', root));
    const km = statsOf(id);
    const paint = () => {
      const vals = {};
      let n = 0;
      Object.entries(km).forEach(([k, r]) => {
        const seen = r.h + r.m;
        if (STAT.heat === 'err') {
          if (seen >= 4) { vals[k] = Math.min(1, (r.m / seen) / 0.2); n++; }
        } else if (r.n >= 4) { vals[k] = clamp((r.t / r.n - 180) / 520, 0, 1); n++; }
      });
      kb.heat(vals);
      $('#heatLegend', root).textContent = n
        ? (STAT.heat === 'err' ? 'Plus la touche est foncée, plus tu la rates souvent (à partir de 20 % d\'erreurs, elle est au maximum).' : 'Plus la touche est foncée, plus ton doigt met du temps à l\'atteindre.')
        : 'Pas encore assez de données : fais quelques exercices.';
      $$('[data-heat]', root).forEach(b => b.classList.toggle('on', b.dataset.heat === STAT.heat));
    };
    $$('[data-heat]', root).forEach(b => b.addEventListener('click', () => { STAT.heat = b.dataset.heat; paint(); }));
    paint();
    const gw = $('#goWeak', root);
    if (gw) gw.addEventListener('click', () => {
      PR.type = 'weak'; PR.scope = 'all'; PR.len = 100;
      const t = practiceText(100);
      if (!t) { go('pratique'); return; }
      startRun({ kind: 'practice', back: 'stats', kicker: 'Entraînement ciblé', title: 'Mes touches faibles', sub: 'Mots avec tes touches les plus ratées', ref: 'weak', make: () => practiceText(100) || t });
    });
  },
};

        <div class="kb-detect"><p class="small"><b>Reconnaître mon clavier.</b> Appuie sur la touche 8 de la rangée du haut, sans Maj : le site règle la disposition tout seul.</p><p class="small muted" data-kbc-status role="status"></p></div>
        <h2>Pendant la frappe</h2>
        <label class="check"><input type="checkbox" data-set="stopOnError"${s.stopOnError ? ' checked' : ''}><span><b>Rester sur la touche en cas d'erreur</b><small>Recommandé : tu ne passes à la suite qu'avec la bonne touche.</small></span></label>
        <label class="check"><input type="checkbox" data-set="showKeyboard"${s.showKeyboard ? ' checked' : ''}><span><b>Afficher le clavier à l'écran</b><small>Montre la touche à taper. Désactive-le quand tu te sens prêt.</small></span></label>
        <label class="check"><input type="checkbox" data-set="showHands"${s.showHands ? ' checked' : ''}><span><b>Afficher les mains</b><small>Allume le doigt qui doit frapper.</small></span></label>
        <label class="check"><input type="checkbox" data-set="showSpaces"${s.showSpaces ? ' checked' : ''}><span><b>Marquer les espaces</b><small>Un petit point entre les mots.</small></span></label>
        <label class="check"><input type="checkbox" data-set="sound"${s.sound ? ' checked' : ''}><span><b>Sons</b><small>Un petit clic à chaque touche, un son grave en cas d'erreur.</small></span></label>
      </section>
      <section class="panel stack">
        <h2>Affichage</h2>
        <div class="field"><span>Thème</span>
          <div class="chips">${[['auto', 'Automatique'], ['light', 'Clair'], ['dark', 'Sombre']].map(o => `<label class="chip-radio"><input type="radio" name="theme" value="${o[0]}"${sel('theme', o[0])}><span>${o[1]}</span></label>`).join('')}</div>
        </div>
        <div class="field"><span>Taille du texte à taper</span>
          <div class="chips">${[['s', 'Petite'], ['m', 'Moyenne'], ['l', 'Grande']].map(o => `<label class="chip-radio"><input type="radio" name="textSize" value="${o[0]}"${(s.textSize || 'm') === o[0] ? ' checked' : ''}><span>${o[1]}</span></label>`).join('')}</div>
        </div>
        <div class="field"><span>Précision demandée pour valider un exercice</span>
          <div class="chips">${[85, 90, 93, 95].map(v => `<label class="chip-radio"><input type="radio" name="passAcc" value="${v}"${s.passAcc === v ? ' checked' : ''}><span>${v} %</span></label>`).join('')}</div>
        </div>
        <h2>Sauvegarde</h2>
        <p class="small"><span class="sync ${Sync.state}" data-sync>${esc(SYNC_TEXT[Sync.state])}</span></p>
        <p class="small muted">${APP_TARGET === 'artifact'
          ? 'Chaque exercice terminé est enregistré automatiquement. Quand tu ouvres le site depuis ton compte claude.ai, il est aussi copié sur ton compte. Le fichier sert de copie de secours, ou pour déplacer tes progrès à la main. Le fichier du site ouvert hors ligne garde ses progrès à part.'
          : 'Chaque exercice terminé est enregistré automatiquement sur cet appareil. Pour retrouver tes progrès sur un autre appareil, télécharge ta sauvegarde ici, puis restaure-la là-bas. Garde aussi une copie de temps en temps : si tu effaces les données du navigateur, la progression part avec.'}</p>
        <div class="cta">
          <button class="btn primary" type="button" id="expFile">Télécharger ma sauvegarde</button>
          <button class="btn" type="button" id="impPick">Restaurer depuis un fichier</button>
          <input type="file" id="impFile" accept=".json,application/json" hidden>
        </div>
        <p class="small" id="saveMsg" role="status"></p>
        <p class="small muted">Restaurer fusionne le fichier avec ta progression actuelle : on garde les meilleures étoiles et on réunit les historiques, rien n'est écrasé.</p>
        <details id="altSave" class="alt-save">
          <summary>Autre méthode : copier et coller</summary>
          <div class="stack">
            <div class="cta"><button class="btn sm" type="button" id="exp">Afficher ma sauvegarde</button></div>
            <textarea id="expBox" rows="4" readonly hidden aria-label="Sauvegarde exportée"></textarea>
            <div class="cta" id="expRow" hidden><button class="btn sm" type="button" id="expCopy">Copier</button></div>
            <label class="field" for="impBox"><span>Restaurer</span><textarea id="impBox" rows="3" placeholder="Colle ici une sauvegarde"></textarea></label>
            <div class="cta"><button class="btn sm" type="button" id="imp">Restaurer cette sauvegarde</button></div>
          </div>
        </details>
        <h2>Remise à zéro</h2>
        <div class="cta"><button class="btn danger" type="button" id="rst">Effacer ma progression</button></div>
        <div class="note warn" id="rstBox" hidden><b>Cette action efface tout : leçons, statistiques, réglages.</b>
          <div class="cta"><button class="btn danger" type="button" id="rstYes">Oui, tout effacer</button> <button class="btn ghost" type="button" id="rstNo">Annuler</button></div></div>
      </section>
    </div>`;
  },
  mount(root) {
    const s = settings();
    $$('input[name="layout"]', root).forEach(i => i.addEventListener('change', () => setKeyboard(i.value, 'manual')));
    App.cleanup = bindKbCheck(root);
    $$('input[name="theme"]', root).forEach(i => i.addEventListener('change', () => { s.theme = i.value; Store.save(); applyTheme(); }));
    $$('input[name="textSize"]', root).forEach(i => i.addEventListener('change', () => { s.textSize = i.value; Store.save(); }));
    $$('input[name="passAcc"]', root).forEach(i => i.addEventListener('change', () => { s.passAcc = +i.value; Store.save(); }));
    $$('[data-set]', root).forEach(i => i.addEventListener('change', () => { s[i.dataset.set] = i.checked; Store.save(); }));
    const msg = $('#saveMsg', root);
    // Fichier de sauvegarde : la plateforme demande confirmation (capacité « downloads »),
    // sinon, hors de claude.ai, on retombe sur un lien de téléchargement ordinaire.
    $('#expFile', root).addEventListener('click', async () => {
      const name = 'dix-doigts-sauvegarde-' + todayStr() + '.json';
      const data = Store.exportJSON();
      try {
        const dl = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('downloads') : null;
        if (dl) {
          const r = await dl.save({ filename: name, data });
          msg.textContent = r && r.status === 'saved' ? 'Fichier enregistré : ' + name : 'Fichier envoyé : ' + name;
          return;
        }
      } catch (e) {
        if (e && e.code === 'declined') { msg.textContent = 'Téléchargement annulé.'; return; }
        if (e && e.code === 'rate_limited') { msg.textContent = 'Une demande est déjà ouverte : réponds-y, puis réessaie.'; return; }
      }
      // téléphone ou tablette : la feuille de partage permet de l'enregistrer dans Fichiers ou de l'envoyer
      if (isTouchOnly() && navigator.canShare && typeof File === 'function') {
        try {
          const file = new File([data], name, { type: 'application/json' });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: 'Sauvegarde Dix Doigts' });
            msg.textContent = 'Sauvegarde partagée : ' + name;
            return;
          }
        } catch (e) {
          if (e && e.name === 'AbortError') { msg.textContent = 'Partage annulé.'; return; }
        }
      }
      try {
        const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
        const a = document.createElement('a');
        a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        msg.textContent = 'Téléchargement lancé : ' + name;
      } catch (e) {
        $('#altSave', root).open = true;
        msg.textContent = 'Le téléchargement n\'est pas possible ici : utilise la méthode copier-coller ci-dessous.';
      }
    });
    $('#impPick', root).addEventListener('click', () => $('#impFile', root).click());
    $('#impFile', root).addEventListener('change', async e => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      if (f.size > 8e6) { msg.textContent = 'Ce fichier est trop gros pour être une sauvegarde.'; return; }
      try { Store.importJSON(await f.text()); msg.textContent = 'Sauvegarde fusionnée avec ta progression actuelle.'; applyTheme(); }
      catch (err) { msg.textContent = 'Ce fichier n\'est pas une sauvegarde valide.'; }
      e.target.value = '';
    });
    $('#exp', root).addEventListener('click', () => {
      const b = $('#expBox', root); b.hidden = false; b.value = Store.exportJSON(); b.focus(); b.select();
      $('#expRow', root).hidden = false;
    });
    $('#expCopy', root).addEventListener('click', async () => {
      const b = $('#expBox', root);
      try { await navigator.clipboard.writeText(b.value); msg.textContent = 'Copié dans le presse-papiers.'; }
      catch (e) { b.focus(); b.select(); msg.textContent = 'Sélectionné : fais Ctrl + C pour copier.'; }
    });
    $('#imp', root).addEventListener('click', () => {
      try { Store.importJSON($('#impBox', root).value.trim()); msg.textContent = 'Sauvegarde fusionnée avec ta progression actuelle.'; applyTheme(); }
      catch (e) { msg.textContent = 'Ce texte n\'est pas une sauvegarde valide.'; }
    });
    $('#rst', root).addEventListener('click', () => { $('#rstBox', root).hidden = false; });
    $('#rstNo', root).addEventListener('click', () => { $('#rstBox', root).hidden = true; });
    $('#rstYes', root).addEventListener('click', () => { Store.reset(); applyTheme(); go('home'); });
  },
};

/* ===== 07-main.js ===== */
/* ============================================================
   Routeur, en-tête, thème, démarrage
   ============================================================ */
'use strict';

const NAV = [
  ['home', 'Accueil'], ['guide', 'Guide'], ['cours', 'Parcours'], ['pratique', 'Entraînement'],
  ['test', 'Test'], ['jeu', 'Jeu'], ['stats', 'Statistiques'],
];

function applyTheme() {
  const t = settings().theme, r = document.documentElement;
  if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t); else r.removeAttribute('data-theme');
}
function effectiveDark() {
  const t = settings().theme;
  if (t === 'dark') return true;
  if (t === 'light') return false;
  try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; }
}

function renderChrome() {
  $('#top').innerHTML = `
    <div class="top-in">
      <button class="brand" type="button" data-go="home" aria-label="Dix Doigts, accueil">
        <span class="logo" aria-hidden="true"><i class="f-lp"></i><i class="f-lr"></i><i class="f-lm"></i><i class="f-li"></i><i class="f-ri"></i><i class="f-rm"></i><i class="f-rr"></i><i class="f-rp"></i></span>
        <span class="brand-name">Dix Doigts</span>
      </button>
      <nav class="nav" aria-label="Navigation principale">
        ${NAV.map(n => `<button type="button" class="nav-i" data-go="${n[0]}" data-nav="${n[0]}">${n[1]}</button>`).join('')}
      </nav>
      <div class="top-actions">
        <button class="icon-btn" type="button" data-theme-toggle aria-label="Changer de thème" title="Changer de thème">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" type="button" data-go="reglages" data-nav="reglages" aria-label="Réglages" title="Réglages">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>`;
  $('#foot').innerHTML = `<div class="foot-in"><span>Dix Doigts : apprendre à taper à dix doigts, en français.</span><span class="muted"><span class="sync ${Sync.state}" data-sync>${esc(SYNC_TEXT[Sync.state])}</span> · <button class="link" type="button" data-go="reglages">Sauvegarde</button></span></div>`;
}
function updateNav() {
  let cur = App.page;
  if (App.page === 'lecon') cur = 'cours';
  else if (App.page === 'run') cur = App.run ? (App.run.kind === 'lesson' ? 'cours' : (App.run.back || 'pratique')) : 'cours';
  $$('[data-nav]').forEach(b => {
    const on = b.dataset.nav === cur;
    b.classList.toggle('on', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
}

function render() {
  if (App.cleanup) { try { App.cleanup(); } catch (e) { /* ignoré */ } App.cleanup = null; }
  const P = PAGES[App.page] || PAGES.home;
  const main = $('#main');
  main.innerHTML = `<div class="wrap page page-${App.page}">${P.html(App.param)}</div>`;
  updateNav();
  if (P.mount) P.mount(main, App.param);
}

function go(page, param, fromHash) {
  if (!PAGES[page]) page = 'home';
  if (page !== App.page) App.kbNote = null;
  App.page = page; App.param = param || null;
  if (!fromHash) {
    try { const h = '#' + page + (param ? '-' + param : ''); if (location.hash !== h) location.hash = h; } catch (e) { /* iframe : ignoré */ }
  }
  render();
  window.scrollTo(0, 0);
  // la page reçoit le focus, sauf si elle l'a déjà donné (zone de frappe ouverte sur un écran tactile)
  const m = $('#main');
  if (m && !m.contains(document.activeElement)) { try { m.focus({ preventScroll: true }); } catch (e) { /* ignoré */ } }
}

function parseHash() {
  const m = /^#([a-z]+)(?:-(.+))?$/.exec(location.hash || '');
  if (!m || !PAGES[m[1]] || m[1] === 'run') return null;
  return { page: m[1], param: m[2] || null };
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-run],[data-scroll],[data-theme-toggle]');
  if (!t) return;
  if (t.hasAttribute('data-theme-toggle')) {
    settings().theme = effectiveDark() ? 'light' : 'dark'; Store.save(); applyTheme(); return;
  }
  if (t.dataset.scroll) {
    const el = document.getElementById(t.dataset.scroll);
    if (el) el.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
    return;
  }
  if (t.dataset.run) {
    const [kind, lessonId, stage] = t.dataset.run.split(':');
    if (kind === 'lesson') startRun({ kind: 'lesson', lessonId, stage: +stage });
    return;
  }
  if (t.dataset.go != null) {
    const i = t.dataset.go.indexOf(':');
    const page = i < 0 ? t.dataset.go : t.dataset.go.slice(0, i);
    const param = i < 0 ? null : t.dataset.go.slice(i + 1);
    go(page, param);
  }
});

window.addEventListener('hashchange', () => {
  const h = parseHash();
  if (h && (h.page !== App.page || h.param !== App.param)) go(h.page, h.param, true);
});

function boot() {
  Store.load();
  applyTheme();
  renderChrome();
  const h = parseHash();
  go(h ? h.page : 'home', h ? h.param : null, true);
  Sync.init();
  initApp();
}
boot();

</script>
